experiment_name: "NORMA Best Configurations"
experiment_type: "pipeline"

datasets:
  # - restaurant-inspections
  - tax-chu

variants:
  - name: "NORMA (Mistral-large + GPT-5)"
    classifier:
      implementation: "llm"
      model: "mistral-large-2512"
      prompt_key: "few_shot"
      batch_size: 5
      use_context: false
    mapper:
      model: "gpt-5"
      prompt_key: "enhanced_with_domain_v2"
      temperature: 0.0
      batch_size: 5
  
