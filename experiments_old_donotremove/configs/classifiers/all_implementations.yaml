experiment_name: "Classifier Comparison - All Implementations"
experiment_type: "classifier"
results_dir: "results"
datasets:
  - sisu

variants:


  # ============================================
  # Mistral-small
  # ============================================
  - name: "Mistral-small (zero_shot)"
    implementation: "llm"
    model: "mistral-small-2506"
    prompt_key: "zero_shot"
    batch_size: 10
    use_context: false

  - name: "Mistral-small (zero_shot_with_table)"
    implementation: "llm"
    model: "mistral-small-2506"
    prompt_key: "zero_shot_with_table"
    batch_size: 10
    use_context: true
    num_rows_context: 3

  - name: "Mistral-small (with_examples)"
    implementation: "llm"
    model: "mistral-small-2506"
    prompt_key: "with_examples"
    batch_size: 10
    use_context: false

  - name: "Mistral-small (with_examples_and_table)"
    implementation: "llm"
    model: "mistral-small-2506"
    prompt_key: "with_examples_and_table"
    batch_size: 10
    use_context: true
    num_rows_context: 3


