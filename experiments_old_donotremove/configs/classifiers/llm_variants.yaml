experiment_name: "LLM Classifier Variants"
experiment_type: "classifier"

# Datasets to test on
datasets:
  - restaurant-inspections
  - tax-chu
  - sisu

# Variants to compare
variants:
  # Mistral models
  - name: "Mistral-large (few-shot)"
    implementation: "llm"
    model: "mistral-large-2512"
    prompt_key: "few_shot"
    batch_size: 10
    use_context: false
  
  - name: "Mistral-large (few-shot + context)"
    implementation: "llm"
    model: "mistral-large-2512"
    prompt_key: "few_shot_with_context"
    batch_size: 10
    use_context: true
  
  # GPT models
  - name: "GPT-5-mini (few-shot)"
    implementation: "llm"
    model: "gpt-5-mini"
    prompt_key: "few_shot"
    batch_size: 10
    use_context: false
  
  - name: "GPT-5 (few-shot + context)"
    implementation: "llm"
    model: "gpt-5"
    prompt_key: "few_shot_with_context"
    batch_size: 10
    use_context: true
