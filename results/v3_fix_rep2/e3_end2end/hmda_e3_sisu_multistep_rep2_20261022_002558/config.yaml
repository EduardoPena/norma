dataset_options:
  sisu:
    drop_multi_rule_sentences: false
    gt_file: sisu_text2rule_gt.json
    predicate_space: v2
    sample_rows: 1000000
    stream_csv: true
datasets:
- sisu
experiment_name: hmda_e3_sisu_MultiStep_rep2
experiment_type: mapper
results_dir: results/v3_fix_rep2/e3_end2end
variants:
- mapper:
    implementation: multi_step_refinement
    max_refinement_iterations: 2
    max_violation_share: 0.9
    model: anthropic/claude-sonnet-5.5
    prompt_file: multi_step_refinement
    provider: openrouter
  mode: SENTENCE_DIRECT
  name: Multi-Step | Claude Sonnet 5.5
  use_context: false
