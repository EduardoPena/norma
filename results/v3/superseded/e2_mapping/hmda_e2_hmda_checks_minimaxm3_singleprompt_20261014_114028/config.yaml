dataset_options:
  hmda_checks:
    drop_multi_rule_sentences: false
    gt_file: hmda_regc_checks-text2rule-gt.json
    predicate_space: v2
    sample_rows: 1000000
    stream_csv: true
datasets:
- hmda_checks
experiment_name: hmda_e2_hmda_checks_minimaxm3_SinglePrompt
experiment_type: mapper_gt_only
results_dir: results/v3/e2_mapping
variants:
- mapper:
    batch_size: 3
    column_retrieval: semantic
    embedding_model: openai/text-embedding-3-large
    explain_violation: true
    implementation: llm
    max_candidate_predicates: 1000
    max_relevant_columns: 12
    model: minimax/minimax-m3
    prompt_key: with_examples_v2
    provider: openrouter
  name: Single Prompt | MiniMax-M3
  use_context: false
