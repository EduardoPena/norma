dataset_options:
  hospital:
    drop_multi_rule_sentences: false
    gt_file: hospital-holo_text2rule_gt.json
    predicate_space: v2
    sample_rows: 1000000
    stream_csv: true
datasets:
- hospital
experiment_name: hmda_e2_hospital_sonnet55_SinglePrompt
experiment_type: mapper_gt_only
results_dir: results/v3/e2_mapping
variants:
- mapper:
    batch_size: 3
    column_retrieval: semantic
    embedding_model: openai/text-embedding-3-large
    explain_violation: true
    implementation: llm
    max_candidate_predicates: 1000
    max_relevant_columns: 12
    model: anthropic/claude-sonnet-5.5
    prompt_key: with_examples_v2
    provider: openrouter
  name: Single Prompt | Claude Sonnet 5.5
  use_context: false
