dataset_options:
  sisu:
    drop_multi_rule_sentences: false
    gt_file: sisu_text2rule_gt.json
    predicate_space: v2
    sample_rows: 1000000
    stream_csv: true
datasets:
- sisu
experiment_name: hmda_e3_sisu_C_MS
experiment_type: mapper
results_dir: results/v3/e3_end2end
variants:
- classifier:
    batch_size: 10
    implementation: llm
    model: qwen/qwen3.8-2.4t-a95b
    prompt_key: with_examples
    provider: openrouter
  mapper:
    implementation: multi_step_refinement
    max_refinement_iterations: 2
    model: openai/gpt-6-sol
    prompt_file: multi_step_refinement
    provider: openrouter
  mode: SENTENCE_FILTERED
  name: C+MS | Qwen3.8-2.4T-A95B + GPT-6 Sol
  use_context: false
