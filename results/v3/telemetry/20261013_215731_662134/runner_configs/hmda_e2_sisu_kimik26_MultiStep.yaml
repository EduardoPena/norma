experiment_name: hmda_e2_sisu_kimik26_MultiStep
experiment_type: mapper_gt_only
results_dir: results/v3/e2_mapping
datasets:
- sisu
dataset_options:
  sisu:
    gt_file: sisu_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
    predicate_space: v2
variants:
- name: Multi-Step | Kimi K2.6
  use_context: false
  mapper:
    implementation: multi_step_refinement
    provider: openrouter
    max_refinement_iterations: 2
    prompt_file: multi_step_refinement
    model: moonshotai/kimi-k2.6
