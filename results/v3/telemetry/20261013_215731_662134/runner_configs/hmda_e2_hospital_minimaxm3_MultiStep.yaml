experiment_name: hmda_e2_hospital_minimaxm3_MultiStep
experiment_type: mapper_gt_only
results_dir: results/v3/e2_mapping
datasets:
- hospital
dataset_options:
  hospital:
    gt_file: hospital-holo_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
    predicate_space: v2
variants:
- name: Multi-Step | MiniMax-M3
  use_context: false
  mapper:
    implementation: multi_step_refinement
    provider: openrouter
    max_refinement_iterations: 2
    prompt_file: multi_step_refinement
    model: minimax/minimax-m3
