dataset_options:
  hmdaz:
    drop_multi_rule_sentences: false
    gt_file: hmdaz_text2rule_gt.json
    predicate_space: v2
    sample_rows: 1000000
    stream_csv: true
datasets:
- hmdaz
experiment_name: hmda_e2_hmdaz_gpt6sol_MultiStep
experiment_type: mapper_gt_only
results_dir: results/v3_fix/e2_mapping
variants:
- mapper:
    implementation: multi_step_refinement
    max_refinement_iterations: 2
    max_violation_share: 0.9
    model: openai/gpt-6-sol
    prompt_file: multi_step_refinement
    provider: openrouter
  name: Multi-Step | GPT-6 Sol
  use_context: false
