experiment_name: hmda_e3_sisu_MultiStep
experiment_type: mapper
results_dir: results/v3_fix/e3_end2end
datasets:
- sisu
dataset_options:
  sisu:
    gt_file: sisu_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
    predicate_space: v2
variants:
- name: Multi-Step | GPT-6 Sol
  mode: SENTENCE_DIRECT
  use_context: false
  mapper:
    implementation: multi_step_refinement
    provider: openrouter
    max_refinement_iterations: 2
    prompt_file: multi_step_refinement
    max_violation_share: 0.9
    model: openai/gpt-6-sol
