with_examples: |
  Task: Convert sentences to denial constraint predicates.

  Definition: A denial constraint is a list of predicates that CANNOT all be true simultaneously.

  Instructions:
  1. Use t1. and t2. as tuple identifiers
  2. Apply denial semantics: "must be X" means violation when "!= X"
  3. Extract concrete values from the sentence (replace $int, $string, $values with actual values)
  4. For SINGLE sentence: Return ["pred1", ...] or null if not a constraint
  5. For MULTIPLE sentences: Return array [result1, result2, ...] where each result is either ["pred1", ...] or null if not a constraint
  6. CRITICAL: Output array length MUST equal input sentence count - use null for non-constraints
  7. Output ONLY the JSON array - no explanations, no markdown labels, no extra text

  Predicate Format:
  - Single-tuple: t1.field_name OPERATOR constant OR t1.field_name OPERATOR t1.field_name2
    Examples: t1.value < 100, t1.status = 'active', t1.start_date < t1.end_date, t1.email IS NOT NULL
  - Cross-tuple: t1.field_name OPERATOR t2.field_name OR t1.field_name OPERATOR t2.field_name2
    Examples: t1.amount > t2.amount, t1.id = t2.id, t1.created_date < t2.updated_date
  - Operators: =, !=, <, <=, >, >=, IN, NOT IN, IS NULL, IS NOT NULL
  - Placeholders: $int (numbers), $string (text), $values (lists)

  Examples:

  Example 1 - Threshold constraint:
  Input: "Value must be at least 100"
  Analysis: Violation occurs when value < 100
  Output: ["t1.value < 100"]

  Example 2 - Cross-tuple consistency:
  Input: "Records with same ID must have same status"
  Analysis: Same ID + different status = violation
  Output: ["t1.id = t2.id", "t1.status != t2.status"]

  Example 3 - Field comparison:
  Input: "Start date must be before end date"
  Analysis: Violation when start_date >= end_date
  Output: ["t1.start_date >= t1.end_date"]

  Example 4 - Required field:
  Input: "Email is required"
  Analysis: Violation when email is null
  Output: ["t1.email IS NULL"]

  Example 5 - Not a constraint:
  Input: "Users generally prefer the new system"
  Analysis: This is a preference, not an enforceable constraint
  Output: null

  Example 6 - Multiple sentences (5 inputs = 5 outputs):
  Input:
  1. Value must be at least 100
  2. Records with same ID must have same status
  3. Users generally prefer the new system
  4. Email is required
  5. The database is fast
  Output: [["t1.value < 100"], ["t1.id = t2.id", "t1.status != t2.status"], null, ["t1.email IS NULL"], null]

  Available predicates:
  {predicates_list}

  Sentences:
  {sentences}

  Output:

