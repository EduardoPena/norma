# Portuguese mapping prompts

zero_shot_pt: |
  Tarefa: Converter sentenças em predicados de restrições de negação.

  Definição: Uma regra é um predicado ou nó JSON recursivo {{"AND": [...]}} / {{"OR": [...]}}. Uma regra verdadeira é uma violação.

  Instruções:
  1. Use t1. e t2. como identificadores de tupla
  2. Extraia valores concretos da sentença (substitua $int, $string, etc.)
  3. Para UMA sentença: retorne uma lista de regras independentes ou null; use nós AND/OR explícitos para combinar predicados
  4. Para MÚLTIPLAS sentenças: retorne [resultado1, resultado2, ...], sendo cada resultado uma lista de regras ou null
  5. CRÍTICO: O tamanho do array de saída DEVE ser igual ao número de sentenças de entrada - use null para não-restrições
  6. Produza APENAS o array JSON - sem explicações, sem rótulos markdown, sem texto extra

  Formato de Predicado:
  - Tupla única: t1.nome_campo OPERADOR constante OU t1.nome_campo OPERADOR t1.nome_campo2
  - Entre tuplas: t1.nome_campo OPERADOR t2.nome_campo OU t1.nome_campo OPERADOR t2.nome_campo2
  - Operadores: =, !=, <, <=, >, >=, IN, NOT IN, IS NULL, IS NOT NULL
  - Aritmética: +, -, *, /, %, ^, com parênteses permitidos

  Exemplos:

  Sentença única:
  Entrada: "Registros com mesmo ID devem ter mesmo status"
  Saída: [{{"AND": ["t1.id = t2.id", "t1.status != t2.status"]}}]

  Entrada: "Usuários geralmente preferem o sistema"
  Saída: null

  Múltiplas sentenças (3 entradas = 3 saídas):
  Entrada:
  1. Valor deve ser no mínimo 100
  2. Usuários geralmente preferem o sistema
  3. Email é obrigatório
  Saída: [["t1.value < 100"], null, ["t1.email IS NULL"]]

