# Mapping prompts for constraint extraction

zero_shot: |
  Task: Convert sentences to denial constraint predicates.

  Definition: A denial constraint is a list of predicates that CANNOT all be true simultaneously.

  Instructions:
  1. Use t1. and t2. as tuple identifiers
  2. Extract concrete values from the sentence (replace $int, $string, etc.)
  3. For SINGLE sentence: Return ["pred1", "pred2", ...] or null if not a constraint
  4. For MULTIPLE sentences: Return array [result1, result2, ...] where each result is either ["pred1", ...] or null if not a constraint
  5. CRITICAL: Output array length MUST equal input sentence count - use null for non-constraints
  6. Output ONLY the JSON array - no explanations, no markdown labels, no extra text

  Predicate Format:
  - Single-tuple: t1.field_name OPERATOR constant OR t1.field_name OPERATOR t1.field_name2
  - Cross-tuple: t1.field_name OPERATOR t2.field_name OR t1.field_name OPERATOR t2.field_name2
  - Operators: =, !=, <, <=, >, >=, IN, NOT IN, IS NULL, IS NOT NULL

  Examples:

  Single sentence:
  Input: "Records with same ID must have same status"
  Output: ["t1.id = t2.id", "t1.status != t2.status"]

  Input: "Users generally prefer the system"
  Output: null

  Multiple sentences (3 inputs = 3 outputs):
  Input:
  1. Value must be at least 100
  2. Users generally prefer the system
  3. Email is required
  Output: [["t1.value < 100"], null, ["t1.email IS NULL"]]

  Available predicates:
  {predicates_list}

  Sentences:
  {sentences}

  Output:

