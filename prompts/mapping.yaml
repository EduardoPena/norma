# Variant of with_examples (2026-10-11): column context, violation semantics for
# definitions and prohibitions, and a written violation condition before the rules.
# The original with_examples (paper protocol) is unchanged.
with_examples_v2: |
  Task: Convert sentences to denial constraint predicates.

  Definition: A rule is a predicate string or a recursive JSON node {{"AND": [...]}} / {{"OR": [...]}}.
  A rule describes the VIOLATION: it is true exactly for the records that break the sentence.

  Instructions:
  1. Use t1. and t2. as tuple identifiers
  2. First write "violated_when": one plain-language sentence saying when a record breaks the
     sentence. Then encode exactly that condition as "rules"
  3. Extract concrete values from the sentence (replace $int, $string, $values with actual values);
     use the column context below for codes, units and allowed values
  4. Return ONLY a JSON object: {{"results": [{{"id": <sentence number>, "violated_when": <text or null>, "rules": <rules list or null>}}, ...]}}
  5. Each "rules" value is a list of independent rules or null; use explicit AND/OR nodes to combine predicates
  6. CRITICAL: Include exactly one result for EACH input sentence, with "id" equal to the sentence number - use "rules": null and "violated_when": null for non-constraints
  7. No explanations outside the JSON, no markdown labels, no extra text

  Violation semantics:
  - Requirement ("must be X", "should be X"): violation when the value is not X.
  - Status or category definition ("A record is Z if <condition>", "Z means ... in which <condition>"):
    violation when the condition holds BUT the record is not classified as Z
    -> AND(<condition>, <status column> != Z). Keep the threshold direction of the sentence
    ("exceeds 6", "more than 6" -> > 6); never negate the condition itself.
  - Prohibition ("A Z record shall not include Y", "Z must not have Y"):
    violation when the record IS Z AND has Y -> AND(<status column> = Z, <Y>). Never drop the subject Z.
  - Scope or exemption ("This section does not apply to W"): if a column records the status the
    section assigns, violation when the record is W AND has that status; otherwise null.
  - Self-check before answering: would a record that fully complies with the sentence make the rule
    true? If yes, the rule is inverted or misses a condition; fix it.

  Predicate Format:
  - Single-tuple: t1.field_name OPERATOR constant OR t1.field_name OPERATOR t1.field_name2
    Examples: t1.value < 100, t1.status = 'active', t1.start_date < t1.end_date, t1.email IS NOT NULL
  - Cross-tuple: t1.field_name OPERATOR t2.field_name OR t1.field_name OPERATOR t2.field_name2
    Examples: t1.amount > t2.amount, t1.id = t2.id, t1.created_date < t2.updated_date
  - Operators: =, !=, <, <=, >, >=, IN, NOT IN, IS NULL, IS NOT NULL
  - Arithmetic inside predicates: +, -, *, /, %, ^, with parentheses allowed
  - Placeholders: $int (numbers), $string (text), $values (lists)

  Examples:

  Example 1 - Threshold requirement:
  Input: "Value must be at least 100"
  Output: {{"results": [{{"id": 1, "violated_when": "the value is below 100", "rules": ["t1.value < 100"]}}]}}

  Example 2 - Cross-tuple consistency:
  Input: "Records with same ID must have same status"
  Output: {{"results": [{{"id": 1, "violated_when": "two records share an ID but differ in status", "rules": [{{"AND": ["t1.id = t2.id", "t1.status != t2.status"]}}]}}]}}

  Example 3 - Status definition:
  Input: "An order is a priority order if its weight exceeds 30 kg and it ships to zone 2"
  Output: {{"results": [{{"id": 1, "violated_when": "the weight is above 30 and the zone is 2 but the order is not marked priority", "rules": [{{"AND": ["t1.weight > 30", "t1.zone = 2", "t1.order_status != 'Priority'"]}}]}}]}}
  Wrong: ["t1.weight <= 30"] (negates the condition and drops the status)

  Example 4 - Prohibition:
  Input: "A priority order shall not include a deferred delivery"
  Output: {{"results": [{{"id": 1, "violated_when": "a priority order has a deferred delivery", "rules": [{{"AND": ["t1.order_status = 'Priority'", "t1.deferred_delivery = 1"]}}]}}]}}
  Wrong: ["t1.deferred_delivery = 1"] (drops the subject: flags every deferred order)

  Example 5 - Required field:
  Input: "Email is required"
  Output: {{"results": [{{"id": 1, "violated_when": "the email is missing", "rules": ["t1.email IS NULL"]}}]}}

  Example 6 - Not a constraint:
  Input: "Users generally prefer the new system"
  Output: {{"results": [{{"id": 1, "violated_when": null, "rules": null}}]}}

