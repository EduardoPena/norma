  Instruções:
  1. Use t1. e t2. como identificadores de tupla
  2. Aplique semântica de negação: "deve ser X" significa violação quando "!= X"
  3. Extraia valores concretos da sentença (substitua $int, $string, $values com valores reais)
  4. Para UMA ÚNICA sentença: Retorne ["pred1", ...] ou null se não for uma restrição
  5. Para MÚLTIPLAS sentenças: Retorne array [resultado1, resultado2, ...] onde cada resultado é ["pred1", ...] ou null se não for uma restrição
  6. CRÍTICO: O tamanho do array de saída DEVE ser igual ao número de sentenças de entrada - use null para não-restrições
  7. Produza APENAS o array JSON - sem explicações, sem rótulos markdown, sem texto extra

  Formato de Predicado:
  - Tupla única: t1.nome_campo OPERADOR constante OU t1.nome_campo OPERADOR t1.nome_campo2
    Exemplos: t1.value < 100, t1.status = 'active', t1.start_date < t1.end_date, t1.email IS NOT NULL
  - Entre tuplas: t1.nome_campo OPERADOR t2.nome_campo OU t1.nome_campo OPERADOR t2.nome_campo2
    Exemplos: t1.amount > t2.amount, t1.id = t2.id, t1.created_date < t2.updated_date
  - Operadores: =, !=, <, <=, >, >=, IN, NOT IN, IS NULL, IS NOT NULL
  - Placeholders: $int (números), $string (texto), $values (listas)

  Exemplos:

  Exemplo 1 - Restrição de limiar:
  Entrada: "Valor deve ser no mínimo 100"
  Análise: Violação ocorre quando value < 100
  Saída: ["t1.value < 100"]

  Exemplo 2 - Consistência entre tuplas:
  Entrada: "Registros com mesmo ID devem ter mesmo status"
  Análise: Mesmo ID + status diferente = violação
  Saída: ["t1.id = t2.id", "t1.status != t2.status"]

  Exemplo 3 - Comparação entre campos:
  Entrada: "Data de início deve ser anterior à data de término"
  Análise: Violação quando start_date >= end_date
  Saída: ["t1.start_date >= t1.end_date"]

  Exemplo 4 - Campo obrigatório:
  Entrada: "Email é obrigatório"
  Análise: Violação quando email é nulo
  Saída: ["t1.email IS NULL"]

  Exemplo 5 - Não é uma restrição:
  Entrada: "Usuários geralmente preferem o novo sistema"
  Análise: Isto é uma preferência, não uma restrição aplicável
  Saída: null

  Exemplo 6 - Múltiplas sentenças (5 entradas = 5 saídas):
  Entrada:
  1. Valor deve ser no mínimo 100
  2. Registros com mesmo ID devem ter mesmo status
  3. Usuários geralmente preferem o novo sistema
  4. Email é obrigatório
  5. O banco de dados é rápido
  Saída: [["t1.value < 100"], ["t1.id = t2.id", "t1.status != t2.status"], null, ["t1.email IS NULL"], null]

