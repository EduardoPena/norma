# Mapping prompts for constraint extraction

zero_shot: |
  Task: Convert sentences to denial constraint predicates.

  Definition: A rule is a predicate string or a recursive JSON node {{"AND": [...]}} / {{"OR": [...]}}. A true rule is a violation.

  Instructions:
  1. Use t1. and t2. as tuple identifiers
  2. Extract concrete values from the sentence (replace $int, $string, etc.)
  3. Return ONLY a JSON object: {{"results": [{{"id": <sentence number>, "rules": <rules list or null>}}, ...]}}
  4. Each "rules" value is a list of independent rules or null; use explicit AND/OR nodes to combine predicates
  5. CRITICAL: Include exactly one result for EACH input sentence, with "id" equal to the sentence number - use "rules": null for non-constraints
  6. No explanations, no markdown labels, no extra text

  Predicate Format:
  - Single-tuple: t1.field_name OPERATOR constant OR t1.field_name OPERATOR t1.field_name2
  - Cross-tuple: t1.field_name OPERATOR t2.field_name OR t1.field_name OPERATOR t2.field_name2
  - Operators: =, !=, <, <=, >, >=, IN, NOT IN, IS NULL, IS NOT NULL
  - Arithmetic inside predicates: +, -, *, /, %, ^, with parentheses allowed

  Examples:

  Single sentence:
  Input: "Records with same ID must have same status"
  Output: {{"results": [{{"id": 1, "rules": [{{"AND": ["t1.id = t2.id", "t1.status != t2.status"]}}]}}]}}

  Input: "Users generally prefer the system"
  Output: {{"results": [{{"id": 1, "rules": null}}]}}

  Multiple sentences (3 inputs = 3 outputs):
  Input:
  1. Value must be at least 100
  2. Users generally prefer the system
  3. Email is required
  Output: {{"results": [{{"id": 1, "rules": ["t1.value < 100"]}}, {{"id": 2, "rules": null}}, {{"id": 3, "rules": ["t1.email IS NULL"]}}]}}

  Available predicates:
  {predicates_list}

  Sentences:
  {sentences}

  Output:

zero_shot_with_table: |
  Task: Convert sentences to denial constraint predicates using the table context.

  Definition: A rule is a predicate string or a recursive JSON node {{"AND": [...]}} / {{"OR": [...]}}. A true rule is a violation.

  Table context:
  {table_context}

  Instructions:
  1. Use t1. and t2. as tuple identifiers
  2. Map sentence terms to table columns
  3. Extract concrete values from the sentence (replace $int, $string, etc.)
  4. Return ONLY a JSON object: {{"results": [{{"id": <sentence number>, "rules": <rules list or null>}}, ...]}}
  5. Each "rules" value is a list of independent rules or null; use explicit AND/OR nodes to combine predicates
  6. CRITICAL: Include exactly one result for EACH input sentence, with "id" equal to the sentence number - use "rules": null for non-constraints
  7. No explanations, no markdown labels, no extra text

  Predicate Format:
  - Single-tuple: t1.field_name OPERATOR constant OR t1.field_name OPERATOR t1.field_name2
  - Cross-tuple: t1.field_name OPERATOR t2.field_name OR t1.field_name OPERATOR t2.field_name2
  - Operators: =, !=, <, <=, >, >=, IN, NOT IN, IS NULL, IS NOT NULL
  - Arithmetic inside predicates: +, -, *, /, %, ^, with parentheses allowed

  Examples:

  Single sentence:
  Input: "Value must be at least 100"
  Output: {{"results": [{{"id": 1, "rules": ["t1.value < 100"]}}]}}

  Input: "This is a general comment"
  Output: {{"results": [{{"id": 1, "rules": null}}]}}

  Multiple sentences (4 inputs = 4 outputs):
  Input:
  1. Value must be at least 100
  2. Category must be A or B
  3. The system is working well
  4. Email is required
  Output: {{"results": [{{"id": 1, "rules": ["t1.value < 100"]}}, {{"id": 2, "rules": ["t1.category NOT IN ('A', 'B')"]}}, {{"id": 3, "rules": null}}, {{"id": 4, "rules": ["t1.email IS NULL"]}}]}}

  Available predicates:
  {predicates_list}

  Sentences:
  {sentences}

  Output:

with_examples: |
  Task: Convert sentences to denial constraint predicates.

  Definition: A rule is a predicate string or a recursive JSON node {{"AND": [...]}} / {{"OR": [...]}}. A true rule is a violation.

  Instructions:
  1. Use t1. and t2. as tuple identifiers
  2. Apply denial semantics: "must be X" means violation when "!= X"
  3. Extract concrete values from the sentence (replace $int, $string, $values with actual values)
  4. Return ONLY a JSON object: {{"results": [{{"id": <sentence number>, "rules": <rules list or null>}}, ...]}}
  5. Each "rules" value is a list of independent rules or null; use explicit AND/OR nodes to combine predicates
  6. CRITICAL: Include exactly one result for EACH input sentence, with "id" equal to the sentence number - use "rules": null for non-constraints
  7. No explanations, no markdown labels, no extra text

  Predicate Format:
  - Single-tuple: t1.field_name OPERATOR constant OR t1.field_name OPERATOR t1.field_name2
    Examples: t1.value < 100, t1.status = 'active', t1.start_date < t1.end_date, t1.email IS NOT NULL
  - Cross-tuple: t1.field_name OPERATOR t2.field_name OR t1.field_name OPERATOR t2.field_name2
    Examples: t1.amount > t2.amount, t1.id = t2.id, t1.created_date < t2.updated_date
  - Operators: =, !=, <, <=, >, >=, IN, NOT IN, IS NULL, IS NOT NULL
  - Arithmetic inside predicates: +, -, *, /, %, ^, with parentheses allowed
  - Placeholders: $int (numbers), $string (text), $values (lists)

  Examples:

  Example 1 - Threshold constraint:
  Input: "Value must be at least 100"
  Analysis: Violation occurs when value < 100
  Output: {{"results": [{{"id": 1, "rules": ["t1.value < 100"]}}]}}

  Example 2 - Cross-tuple consistency:
  Input: "Records with same ID must have same status"
  Analysis: Same ID + different status = violation
  Output: {{"results": [{{"id": 1, "rules": [{{"AND": ["t1.id = t2.id", "t1.status != t2.status"]}}]}}]}}

  Example 3 - Field comparison:
  Input: "Start date must be before end date"
  Analysis: Violation when start_date >= end_date
  Output: {{"results": [{{"id": 1, "rules": ["t1.start_date >= t1.end_date"]}}]}}

  Example 4 - Required field:
  Input: "Email is required"
  Analysis: Violation when email is null
  Output: {{"results": [{{"id": 1, "rules": ["t1.email IS NULL"]}}]}}

  Example 5 - Not a constraint:
  Input: "Users generally prefer the new system"
  Analysis: This is a preference, not an enforceable constraint
  Output: {{"results": [{{"id": 1, "rules": null}}]}}

  Example 6 - Multiple sentences (5 inputs = 5 outputs):
  Input:
  1. Value must be at least 100
  2. Records with same ID must have same status
  3. Users generally prefer the new system
  4. Email is required
  5. The database is fast
  Output: {{"results": [{{"id": 1, "rules": ["t1.value < 100"]}}, {{"id": 2, "rules": [{{"AND": ["t1.id = t2.id", "t1.status != t2.status"]}}]}}, {{"id": 3, "rules": null}}, {{"id": 4, "rules": ["t1.email IS NULL"]}}, {{"id": 5, "rules": null}}]}}

  Available predicates:
  {predicates_list}

  Sentences:
  {sentences}

  Output:

