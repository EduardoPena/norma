describe_columns: |
  Task: Write a precise description for each column of the table "{table_name}".

  Each column comes with a profile computed from the data (type, share of nulls,
  number of distinct values, range, most frequent values, detected format, and the
  paired label column when codes have a 1:1 mapping to labels).

  For each column, describe in one to three sentences:
  - what the column most likely represents, using the column name and the values;
  - its unit or encoding when the data show it (e.g. thousands of dollars, YYYYMMDD
    dates, percentage points, coded category whose labels are in another column);
  - the meaning of special values that appear in the data (e.g. 'NA', 'Exempt', 1111).
  Describe only what the profile supports; do not invent regulations, thresholds,
  or values that are not in the profile.

  Column profiles (JSON):
  {profiles}

  Respond ONLY with a JSON object: {{"columns": [{{"name": "<column>", "description": "<text>"}}, ...]}}
  with exactly one entry for each column listed above, using the exact column names.
