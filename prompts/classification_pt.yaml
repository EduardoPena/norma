zero_shot_pt: |
  Tarefa: Para cada sentença, decida se ela expressa uma REGRA DE QUALIDADE DE DADOS.

  Definição: Uma regra de qualidade de dados é uma declaração que pode ser VERIFICADA (verdadeira/falsa) usando apenas os campos/linhas do conjunto de dados.

  SIM — tipos de regra:
  - Campo obrigatório/não-nulo
  - Valores permitidos ou proibidos
  - Limites numéricos ou comparações
  - Requisitos condicionais (se X então Y)
  - Combinações proibidas
  - Consistência entre linhas, unicidade ou ordenação
  - Determinação (mesmo X implica mesmo Y)
  - Integridade referencial
  - Restrições temporais

  NÃO — inclui:
  - Cabeçalhos, títulos, citações
  - Definições ou descrições
  - Justificativas ou explicações
  - Procedimentos ou decisões humanas
  - Declarações não decidíveis a partir dos dados

  Observação: Palavras como "pode/podem/deve" não decidem. Se descrevem uma condição de dados, responda SIM; se descrevem permissão ou processo, responda NÃO.
  Observação: A formulação não desqualifica uma regra. Observações ("X são maiores que Y") e declarações de comportamento do sistema ("X será ordenado por Y", "Z será fornecido para cada W") são regras se o resultado for verificável nos dados.

  Sentenças:
  {sentences}

  Instruções:
  - Responda APENAS com um objeto JSON: {{"labels": [{{"id": <número>, "is_constraint": true ou false}}, ...]}}
  - CRÍTICO: Produza exatamente um rótulo para CADA sentença de entrada, usando o número da sentença como "id" (se 10 sentenças, então 10 rótulos)
  - NÃO inclua explicações, justificativas, raciocínio ou qualquer texto extra
  - Exemplo de formato de saída: {{"labels": [{{"id": 1, "is_constraint": true}}, {{"id": 2, "is_constraint": false}}, {{"id": 3, "is_constraint": true}}]}}

