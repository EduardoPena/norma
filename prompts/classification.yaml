# Classification prompts for rule detection

zero_shot: |
  Task: For each sentence, decide if it states a DATA QUALITY RULE.

  Definition: A data quality rule is a statement that can be VERIFIED (true/false) using only the dataset's fields/rows.

  YES — rule types:
  - Required/non-null field
  - Allowed or forbidden values
  - Numeric bounds or comparisons
  - Conditional requirements (if X then Y)
  - Forbidden combinations
  - Cross-row consistency, uniqueness, or ordering
  - Determinacy (same X implies same Y)
  - Referential integrity
  - Temporal constraints

  NO — includes:
  - Headings, titles, citations
  - Definitions or descriptions
  - Rationale or explanations
  - Procedures or human decisions
  - Statements not decidable from data

  Note: Words like "may/can/should" do not decide. If they describe a data condition, answer YES; if they describe permission or process, answer NO.
  Note: Phrasing does not disqualify a rule. Observations ("X are larger than Y") and system behavior statements ("X will be sorted by Y", "Z will be provided for each W") are rules if the outcome is verifiable in the data.

  Sentences:
  {sentences}

  Instructions:
  - Respond ONLY with a JSON object: {{"labels": [{{"id": <number>, "is_constraint": true or false}}, ...]}}
  - CRITICAL: Output exactly one label for EACH input sentence, using the sentence number as "id" (if 10 sentences, then 10 labels)
  - Do NOT include explanations, justifications, reasoning, or any extra text
  - Output format example: {{"labels": [{{"id": 1, "is_constraint": true}}, {{"id": 2, "is_constraint": false}}, {{"id": 3, "is_constraint": true}}]}}

