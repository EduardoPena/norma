experiment_name: hmda_e2_hmdaz_mistrallarge_MultiStep
experiment_type: mapper_gt_only
results_dir: results/hmda/e2_mapping
datasets:
- hmdaz
dataset_options:
  hmdaz:
    gt_file: hmdaz_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
variants:
- name: Multi-Step | Mistral-Large
  use_context: false
  mapper:
    implementation: multi_step_refinement
    provider: openrouter
    max_refinement_iterations: 2
    prompt_file: multi_step_refinement
    model: mistralai/mistral-large-2512
