experiment_name: "Classifier Comparison - HMDA Official - OpenRouter Battery"
experiment_type: "classifier"
results_dir: "results/official_hmda/classifier"

datasets:
  - hmda

dataset_options:
  hmda:
    gt_file: "hmda_text2rule_gt.json"
    drop_multi_rule_sentences: true
    stream_csv: true
    profile_rows: 10000

variants:
  - name: "OpenRouter | GPT-5"
    implementation: "llm"
    provider: "openrouter"
    model: "openai/gpt-5"
    prompt_key: "with_examples"
    batch_size: 20
    use_context: false

  - name: "OpenRouter | GPT-5 Mini"
    implementation: "llm"
    provider: "openrouter"
    model: "openai/gpt-5-mini"
    prompt_key: "with_examples"
    batch_size: 20
    use_context: false

  - name: "OpenRouter | Mistral Small"
    implementation: "llm"
    provider: "openrouter"
    model: "mistralai/mistral-small-3.2-24b-instruct"
    prompt_key: "with_examples"
    batch_size: 20
    use_context: false

  - name: "OpenRouter | Mistral Large"
    implementation: "llm"
    provider: "openrouter"
    model: "mistralai/mistral-large-2411"
    prompt_key: "with_examples"
    batch_size: 20
    use_context: false

  - name: "OpenRouter | Llama 3.3 70B"
    implementation: "llm"
    provider: "openrouter"
    model: "meta-llama/llama-3.3-70b-instruct"
    prompt_key: "with_examples"
    batch_size: 20
    use_context: false

  - name: "OpenRouter | Qwen3 32B"
    implementation: "llm"
    provider: "openrouter"
    model: "qwen/qwen3-32b"
    prompt_key: "with_examples"
    batch_size: 20
    use_context: false
