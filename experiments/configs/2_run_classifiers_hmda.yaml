experiment_name: "Classifier Comparison - HMDA Sample"
experiment_type: "classifier"
results_dir: "results/classifier_hmda"

datasets:
  - hmda

dataset_options:
  hmda:
    sample_rows: 10000
    gt_file: "hmda_text2rule_gt.json"
    drop_multi_rule_sentences: true

variants:
  - name: "OpenRouter | Gemini 2.5 Flash (with_examples_and_table)"
    implementation: "llm"
    provider: "openrouter"
    model: "google/gemini-2.5-flash"
    prompt_key: "with_examples"
    batch_size: 20
    use_context: false