experiment_name: "GT-Only Mapper Quality - HMDA Checks 500k - OpenRouter GPT-5.4"
experiment_type: "mapper_gt_only"
results_dir: "results/hmda_checks_gpt54_500k/mapping"

datasets:
  - hmda_checks

dataset_options:
  hmda_checks:
    data_file: "hmda.csv"
    gt_file: "hmda_regc_checks-text2rule-gt.json"
    sample_rows: 500000
    stream_csv: true
    profile_rows: 10000
    validate_ground_truth: false
    validate_predicates: false

variants:
  - name: "MultiStep | OpenRouter | GPT-5.4"
    use_context: false
    mapper:
      implementation: "multi_step_refinement"
      provider: "openrouter"
      model: "openai/gpt-5.4"
      max_tokens: 8192
      max_refinement_iterations: 2
      prompt_file: "multi_step_refinement"
      enforce_rule_gate: false
      include_column_descriptions: true
      max_column_description_chars: 200