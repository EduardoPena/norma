# Paper models -> OpenRouter slugs used for the HMDA reproduction.
# Single source for experiments/hmda_model_health.py and hmda_make_configs.py.
# Order = execution order (cheap first, GPT-5 last).
models:
  - key: mistralsmall
    paper_name: Mistral-Small
    slug: mistralai/mistral-small-3.2-24b-instruct
    note: >-
      Paper used mistral-small-2506 (= Mistral Small 3.2 24B). No bare
      "mistralai/mistral-small" slug exists; the newer mistral-small-2603 is a
      different, larger MoE model, so 3.2-24B keeps the size class.
  - key: llama70b
    paper_name: Llama-3.3-70B
    slug: meta-llama/llama-3.3-70b-instruct
    note: Candidate slug, used as-is.
  - key: qwen32b
    paper_name: Qwen3-32B
    slug: qwen/qwen3-32b
    note: Candidate slug, used as-is.
  - key: gpt5mini
    paper_name: GPT-5-mini
    slug: openai/gpt-5-mini
    note: Candidate slug, used as-is.
  - key: mistrallarge
    paper_name: Mistral-Large
    slug: mistralai/mistral-large-2512
    note: >-
      Bare "mistralai/mistral-large" resolves to the Feb-2024 model; 2512 is the
      newest Mistral Large and matches the paper configs (mistral-large-2512).
  - key: gpt5
    paper_name: GPT-5
    slug: openai/gpt-5
    note: Candidate slug, used as-is.
# Components of the end-to-end Norma variants (E3): paper defaults.
end2end:
  classifier: qwen32b
  mapper: gpt5
