experiment_name: "SEGES Classifier Qwen Retry"
experiment_type: "classifier"
results_dir: "results/official_openrouter/classifier_seges_recovery"
max_gt_rules: 3

datasets:
  - seges

dataset_options:
  seges: { data_file: "seges.csv", gt_file: "seges_text2rule_gt.json", stream_csv: true, profile_rows: 10000, validate_ground_truth: false, validate_predicates: false }

variants:
  - { name: "Qwen3 32B | Examples + Table Context", implementation: "llm", provider: "openrouter", model: "qwen/qwen3-32b", prompt_key: "with_examples_and_table", batch_size: 1, use_context: true, num_rows_context: 3 }