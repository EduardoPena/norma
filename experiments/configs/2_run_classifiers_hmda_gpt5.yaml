experiment_name: "Classifier Comparison - HMDA Sample - GPT-5"
experiment_type: "classifier"
results_dir: "results/classifier_hmda"

datasets:
  - hmda

dataset_options:
  hmda:
    sample_rows: 100000
    gt_file: "hmda_text2rule_gt.json"
    drop_multi_rule_sentences: true

variants:
  - name: "OpenRouter | GPT-5"
    implementation: "llm"
    provider: "openrouter"
    model: "gpt-5"
    prompt_key: "with_examples"
    batch_size: 20
    use_context: false
