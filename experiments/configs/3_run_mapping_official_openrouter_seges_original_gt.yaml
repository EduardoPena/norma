  - name: "Single Prompt | Qwen3 32B"
    use_context: true
    num_rows_context: 3
    mapper: { implementation: "llm", provider: "openrouter", model: "qwen/qwen3-32b", prompt_key: "with_examples_and_table", batch_size: 1, structured_output: true, max_parse_retries: 1, use_sample_for_evaluation: true, empty_violation_policy: "exclude" }
  - name: "Multi-Step | Qwen3 32B"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "qwen/qwen3-32b", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true, use_sample_for_evaluation: true, use_sample_for_validation: true, empty_violation_policy: "exclude" }