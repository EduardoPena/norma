experiment_name: "Official GT-Only Mapping - SEGES Original GT"
experiment_type: "mapper_gt_only"
results_dir: "results/official_openrouter/mapping_seges_original_gt"

datasets:
  - seges

dataset_options:
  seges: { data_file: "seges.csv", gt_file: "seges_text2rule_gt.json", stream_csv: true, profile_rows: 10000, validate_ground_truth: false, validate_predicates: false }

variants:
  - name: "Single Prompt | GPT-5"
    use_context: true
    num_rows_context: 3
    mapper: { implementation: "llm", provider: "openrouter", model: "openai/gpt-5", prompt_key: "with_examples_and_table", batch_size: 1, structured_output: true, max_parse_retries: 1, use_sample_for_evaluation: true, empty_violation_policy: "exclude" }
  - name: "Multi-Step | GPT-5"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "openai/gpt-5", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true, use_sample_for_evaluation: true, use_sample_for_validation: true, empty_violation_policy: "exclude" }
  - name: "Single Prompt | GPT-5 Mini"
    use_context: true
    num_rows_context: 3
    mapper: { implementation: "llm", provider: "openrouter", model: "openai/gpt-5-mini", prompt_key: "with_examples_and_table", batch_size: 1, structured_output: true, max_parse_retries: 1, use_sample_for_evaluation: true, empty_violation_policy: "exclude" }
  - name: "Multi-Step | GPT-5 Mini"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "openai/gpt-5-mini", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true, use_sample_for_evaluation: true, use_sample_for_validation: true, empty_violation_policy: "exclude" }
  - name: "Single Prompt | Llama 3.3 70B"
    use_context: true
    num_rows_context: 3
    mapper: { implementation: "llm", provider: "openrouter", model: "meta-llama/llama-3.3-70b-instruct", prompt_key: "with_examples_and_table", batch_size: 1, structured_output: true, max_parse_retries: 1, use_sample_for_evaluation: true, empty_violation_policy: "exclude" }
  - name: "Multi-Step | Llama 3.3 70B"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "meta-llama/llama-3.3-70b-instruct", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true, use_sample_for_evaluation: true, use_sample_for_validation: true, empty_violation_policy: "exclude" }
  - name: "Single Prompt | Mistral Medium 3.5"
    use_context: true
    num_rows_context: 3
    mapper: { implementation: "llm", provider: "openrouter", model: "mistralai/mistral-medium-3-5", prompt_key: "with_examples_and_table", batch_size: 1, structured_output: true, max_parse_retries: 1, use_sample_for_evaluation: true, empty_violation_policy: "exclude" }
  - name: "Multi-Step | Mistral Medium 3.5"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "mistralai/mistral-medium-3-5", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true, use_sample_for_evaluation: true, use_sample_for_validation: true, enable_semantic_auditor: false, empty_violation_policy: "exclude" }
  - name: "Single Prompt | Mistral Small"
    use_context: true
