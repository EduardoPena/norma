experiment_name: "Document Mapper Evaluation - HMDA Sample"
experiment_type: "mapper_document"
results_dir: "results/end2end_document_hmda"

datasets:
  - hmda

dataset_options:
  hmda:
    sample_rows: 10000
    gt_file: "hmda_text2rule_gt.json"
    drop_multi_rule_sentences: true

variants:
  - name: "DOCUMENT | openrouter | gemini-2.5-flash"
    use_context: true
    num_rows_context: 3
    document_mapper:
      implementation: "llm_document"
      provider: "openrouter"
      model: "google/gemini-2.5-flash"
      prompt_key: "basic_with_examples"