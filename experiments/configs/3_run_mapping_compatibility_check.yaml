experiment_name: "Compatibility Check - Multi-Step OpenRouter"
experiment_type: "mapper_gt_only"
results_dir: "results/compatibility_check/mapping"
datasets:
  - hospital
  - restaurant
  - sisu
  - tax
dataset_options:
  hospital: { data_file: "hospital-holo.csv", gt_file: "hospital-holo_text2rule_gt.json", stream_csv: true, profile_rows: 10000 }
  restaurant: { data_file: "restaurant-inspections.csv", gt_file: "restaurant-inspections_text2rule_gt.json", stream_csv: true, profile_rows: 10000 }
  sisu: { data_file: "sisu.csv", gt_file: "sisu_text2rule_gt.json", stream_csv: true, profile_rows: 10000 }
  tax: { data_file: "tax_normalized.csv", gt_file: "tax_text2rule_gt.json", stream_csv: true, profile_rows: 10000 }
variants:
  - name: "Multi-Step Compatibility | GPT-5"
    use_context: false
    mapper:
      implementation: "multi_step_refinement"
      provider: "openrouter"
      model: "openai/gpt-5"
      max_refinement_iterations: 2
      prompt_file: "multi_step_refinement_compatible"