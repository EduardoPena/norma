experiment_name: "Restaurant Classifier - OpenRouter GPT-5.4 - All Prompts"
experiment_type: "classifier"
results_dir: "results/classifier_gpt54_all_prompts"

datasets:
  - restaurant

dataset_options:
  restaurant:
    data_file: "restaurant-inspections.csv"
    gt_file: "restaurant-inspections_text2rule_gt.json"
    validate_ground_truth: false

variants:
  - name: "GPT-5.4 | zero_shot"
    implementation: "llm"
    provider: "openrouter"
    model: "openai/gpt-5.4"
    prompt_key: "zero_shot"
    batch_size: 20
    use_context: false

  - name: "GPT-5.4 | zero_shot_with_table"
    implementation: "llm"
    provider: "openrouter"
    model: "openai/gpt-5.4"
    prompt_key: "zero_shot_with_table"
    batch_size: 20
    use_context: true
    num_rows_context: 3

  - name: "GPT-5.4 | with_examples"
    implementation: "llm"
    provider: "openrouter"
    model: "openai/gpt-5.4"
    prompt_key: "with_examples"
    batch_size: 20
    use_context: false

  - name: "GPT-5.4 | with_examples_and_table"
    implementation: "llm"
    provider: "openrouter"
    model: "openai/gpt-5.4"
    prompt_key: "with_examples_and_table"
    batch_size: 20
    use_context: true
    num_rows_context: 3

  - name: "GPT-5.4 | zero_shot_pt"
    implementation: "llm"
    provider: "openrouter"
    model: "openai/gpt-5.4"
    prompt_key: "zero_shot_pt"
    batch_size: 20
    use_context: false

  - name: "GPT-5.4 | zero_shot_with_table_pt"
    implementation: "llm"
    provider: "openrouter"
    model: "openai/gpt-5.4"
    prompt_key: "zero_shot_with_table_pt"
    batch_size: 20
    use_context: true
    num_rows_context: 3

  - name: "GPT-5.4 | with_examples_pt"
    implementation: "llm"
    provider: "openrouter"
    model: "openai/gpt-5.4"
    prompt_key: "with_examples_pt"
    batch_size: 20
    use_context: false

  - name: "GPT-5.4 | with_examples_and_table_pt"
    implementation: "llm"
    provider: "openrouter"
    model: "openai/gpt-5.4"
    prompt_key: "with_examples_and_table_pt"
    batch_size: 20
    use_context: true
    num_rows_context: 3
