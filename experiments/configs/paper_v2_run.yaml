# Telemetry/budget config for the official round on the paper datasets
# (hospital, restaurant, sisu, tax), same models and protocol as the HMDA round
# (experiments/configs/hmda_v2_run.yaml). Runner configs: experiments/configs/paper_v2/.
# Datasets have <= 128k rows: sample_rows reads them whole, as in the paper.
results_dir: "results/paper_v2/telemetry"
sample_rows: 1000000
max_tokens: 32768
request_timeout_s: 600
max_cost_usd: 70.0        # safety cap; E1+E2 estimate ~US$ 39 (E3 budgeted separately)
parallel_requests: 6
parallel_jobs: 3
min_free_memory_gib: 3    # paper datasets are small (< 1 GB per job)
