experiment_name: "Document Mapper Evaluation - All Models"
experiment_type: "mapper_document"
results_dir: "results/end2end_document"

# Scope: the entire document (all sentences) is sent to the LLM in a single call.
# No sentence-level alignment is possible, so only aggregate violation discovery
# is computed.
#
# Metrics per variant:
#   Aggregate violation precision / recall / F1  [PRIMARY]
#   Gold violations / Predicted violations / Overlap
#   Number of predicted rules (constraints extracted from the document)
#
# All classification and pairwise metrics are N/A in DOCUMENT mode.

datasets:
  - restaurant
  


variants:

  # ---------------------------------------------------------------------------
  # mistral-small-2506
  # ---------------------------------------------------------------------------
  - name: "DOCUMENT | openrouter | gemini-2.5-flash"
    use_context: true
    num_rows_context: 3
    document_mapper:
      implementation: "llm_document"
      provider: "openrouter"
      model: "google/gemini-2.5-flash"
      prompt_key: "basic_with_examples"

