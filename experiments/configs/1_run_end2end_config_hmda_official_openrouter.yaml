experiment_name: "Full Mapper Evaluation - HMDA Official - OpenRouter Battery"
experiment_type: "mapper"
results_dir: "results/official_hmda/end2end"

datasets:
  - hmda

dataset_options:
  hmda:
    gt_file: "hmda_text2rule_gt.json"
    drop_multi_rule_sentences: true
    stream_csv: true
    profile_rows: 10000

variants:
  - name: "FILTERED | OpenRouter | GPT-5"
    mode: "SENTENCE_FILTERED"
    use_context: false
    classifier:
      implementation: "llm"
      provider: "openrouter"
      model: "openai/gpt-5"
      prompt_key: "with_examples"
    mapper:
      implementation: "multi_step_refinement"
      provider: "openrouter"
      model: "openai/gpt-5"
      max_refinement_iterations: 2
      prompt_file: "multi_step_refinement"

  - name: "FILTERED | OpenRouter | GPT-5 Mini"
    mode: "SENTENCE_FILTERED"
    use_context: false
    classifier:
      implementation: "llm"
      provider: "openrouter"
      model: "openai/gpt-5-mini"
