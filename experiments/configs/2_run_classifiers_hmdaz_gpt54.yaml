experiment_name: "Classifier - HMDAZ 100k + Tax - OpenRouter GPT-5.4"
experiment_type: "classifier"
results_dir: "results/hmdaz_tax_gpt54/classifier"

datasets:
  - hmdaz
  - tax

dataset_options:
  hmdaz:
    data_file: "hmdaz.csv"
    gt_file: "hmdaz_text2rule_gt.json"
    sample_rows: 100000
    stream_csv: true
    profile_rows: 10000
    validate_ground_truth: false
    validate_predicates: false
  tax:
    data_file: "tax_normalized.csv"
    gt_file: "tax_text2rule_gt.json"
    stream_csv: true
    profile_rows: 10000
    validate_ground_truth: false
    validate_predicates: false

variants:
  - name: "OpenRouter | GPT-5.4 | with_examples"
    implementation: "llm"
    provider: "openrouter"
    model: "openai/gpt-5.4"
    prompt_key: "with_examples"
    batch_size: 20
    use_context: false