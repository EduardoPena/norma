experiment_name: hmda_e2_sisu_mistrallarge4_MultiStep
experiment_type: mapper_gt_only
results_dir: results/v3/e2_mapping
datasets:
- sisu
dataset_options:
  sisu:
    gt_file: sisu_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
    predicate_space: v2
variants:
- name: Multi-Step | Mistral Large 4
  use_context: false
  mapper:
    implementation: multi_step_refinement
    provider: openrouter
    max_refinement_iterations: 2
    prompt_file: multi_step_refinement
    model: mistralai/mistral-large-4-0
