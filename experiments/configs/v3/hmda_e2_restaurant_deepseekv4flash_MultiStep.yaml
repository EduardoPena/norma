experiment_name: hmda_e2_restaurant_deepseekv4flash_MultiStep
experiment_type: mapper_gt_only
results_dir: results/v3/e2_mapping
datasets:
- restaurant
dataset_options:
  restaurant:
    gt_file: restaurant-inspections_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
    predicate_space: v2
variants:
- name: Multi-Step | DeepSeek-V4-Flash
  use_context: false
  mapper:
    implementation: multi_step_refinement
    provider: openrouter
    max_refinement_iterations: 2
    prompt_file: multi_step_refinement
    model: deepseek/deepseek-v4-flash
