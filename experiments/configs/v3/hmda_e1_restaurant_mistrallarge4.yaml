experiment_name: hmda_e1_restaurant_mistrallarge4
experiment_type: classifier
results_dir: results/v3/e1_classifiers
datasets:
- restaurant
dataset_options:
  restaurant:
    gt_file: restaurant-inspections_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
    predicate_space: v2
variants:
- name: Mistral Large 4 | No Context
  implementation: llm
  provider: openrouter
  model: mistralai/mistral-large-4-0
  prompt_key: zero_shot
  batch_size: 10
  use_context: false
- name: Mistral Large 4 | Table Context
  implementation: llm
  provider: openrouter
  model: mistralai/mistral-large-4-0
  prompt_key: zero_shot_with_table
  batch_size: 10
  use_context: true
  num_rows_context: 3
- name: Mistral Large 4 | Examples
  implementation: llm
  provider: openrouter
  model: mistralai/mistral-large-4-0
  prompt_key: with_examples
  batch_size: 10
  use_context: false
- name: Mistral Large 4 | Examples + Table Context
  implementation: llm
  provider: openrouter
  model: mistralai/mistral-large-4-0
  prompt_key: with_examples_and_table
  batch_size: 10
  use_context: true
  num_rows_context: 3
