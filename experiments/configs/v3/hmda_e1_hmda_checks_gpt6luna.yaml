experiment_name: hmda_e1_hmda_checks_gpt6luna
experiment_type: classifier
results_dir: results/v3/e1_classifiers
datasets:
- hmda_checks
dataset_options:
  hmda_checks:
    gt_file: hmda_regc_checks-text2rule-gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
    predicate_space: v2
variants:
- name: GPT-6 Luna | No Context
  implementation: llm
  provider: openrouter
  model: openai/gpt-6-luna
  prompt_key: zero_shot
  batch_size: 10
  use_context: false
- name: GPT-6 Luna | Table Context
  implementation: llm
  provider: openrouter
  model: openai/gpt-6-luna
  prompt_key: zero_shot_with_table
  batch_size: 10
  use_context: true
  num_rows_context: 3
- name: GPT-6 Luna | Examples
  implementation: llm
  provider: openrouter
  model: openai/gpt-6-luna
  prompt_key: with_examples
  batch_size: 10
  use_context: false
- name: GPT-6 Luna | Examples + Table Context
  implementation: llm
  provider: openrouter
  model: openai/gpt-6-luna
  prompt_key: with_examples_and_table
  batch_size: 10
  use_context: true
  num_rows_context: 3
