  # ---------------------------------------------------------------------------
  # Classifier: mistral-small  |  Mapper: GPT-5  (cheap clf, strong mapper)
  # ---------------------------------------------------------------------------
  # - name: "FILTERED | ms-clf | gpt-5-llm | with_examples_and_table"
