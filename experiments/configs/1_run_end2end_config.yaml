  # ===========================================================================
  # MODE: DOCUMENT
  # Entire document (all sentences) sent in a single API call.
  # Only aggregate violation metrics are computed; all others are N/A.
  # Requires a 'document_mapper' block (no 'mapper' or 'classifier').
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # GPT-5-mini
  # ---------------------------------------------------------------------------
  - name: "DOCUMENT | openrouter | gemini-2.5-flash"
    mode: "DOCUMENT"
    use_context: true
    num_rows_context: 3
    document_mapper:
      implementation: "llm_document"
      provider: "openrouter"
      model: "google/gemini-2.5-flash"
      prompt_key: "basic_with_examples"

