experiment_name: "Full Mapper Evaluation - Classification + Mapping Quality + Violations"
experiment_type: "mapper"
results_dir: "results/end2end"

datasets:
  - hospital


# =============================================================================
# HOW TO USE
# =============================================================================
# Uncomment the variants you want to run.
# Each variant belongs to one of three modes:
#
#   SENTENCE_DIRECT   — feed all sentences to the mapper directly (no classifier).
#                       Computes: classification + pairwise + aggregate violation.
#
#   SENTENCE_FILTERED — classify first, then map only sentences predicted as rules.
#                       Computes: classification + pairwise + aggregate violation.
#                       Requires a 'classifier' block in the variant.
#
#   DOCUMENT          — send the whole document to the mapper in one call.
#                       Computes: aggregate violation only (all others N/A).
#                       Requires a 'document_mapper' block instead of 'mapper'.
#
# Quick test: one active variant per mode is uncommented below.
# =============================================================================


