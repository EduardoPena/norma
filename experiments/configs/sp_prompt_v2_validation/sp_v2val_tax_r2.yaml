experiment_name: sp_v2val_tax_r2
experiment_type: mapper_gt_only
results_dir: results/sp_prompt_v2_validation/e2_mapping
datasets:
- tax
dataset_options:
  tax:
    gt_file: tax_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
    predicate_space: v2
variants:
- name: Single Prompt | baseline
  use_context: false
  mapper:
    implementation: llm
    provider: openrouter
    model: openai/gpt-6-luna
    max_candidate_predicates: 1000
    max_relevant_columns: 12
    prompt_key: with_examples
    batch_size: 10
- name: Single Prompt | prompt v2
  use_context: false
  mapper:
    implementation: llm
    provider: openrouter
    model: openai/gpt-6-luna
    max_candidate_predicates: 1000
    max_relevant_columns: 12
    prompt_key: with_examples_v2
    batch_size: 3
    column_context: true
    explain_violation: true
