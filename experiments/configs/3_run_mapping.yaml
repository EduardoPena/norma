experiment_name: "GT-Only Mapper Evaluation - Pure Mapping Quality"
experiment_type: "mapper_gt_only"
results_dir: "results/mapper_gt_only"

# Scope: only GT constraint sentences (rules != null) are fed to the mapper.
# No classifier step. This measures pure mapping quality as an upper bound.
#
# Metrics (all over GT sentences only):
#   Syntactic:   exact match, predicate Jaccard (mean ± std)
#   Pairwise:    violation exact match, P/R/F1/Jaccard (mean ± std)
#   Aggregate:   pooled violation P/R/F1, gold/pred/overlap counts
#
# Two mapper types:
#   llm                 → always with_examples_and_table, use_context: true
#   multi_step_refinement → always use_context: false

datasets:
  - restaurant


