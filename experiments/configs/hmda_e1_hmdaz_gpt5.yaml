experiment_name: hmda_e1_hmdaz_gpt5
experiment_type: classifier
results_dir: results/hmda/e1_classifiers
datasets:
- hmdaz
dataset_options:
  hmdaz:
    gt_file: hmdaz_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
variants:
- name: GPT-5 | No Context
  implementation: llm
  provider: openrouter
  model: openai/gpt-5
  prompt_key: zero_shot
  batch_size: 10
  use_context: false
- name: GPT-5 | Table Context
  implementation: llm
  provider: openrouter
  model: openai/gpt-5
  prompt_key: zero_shot_with_table
  batch_size: 10
  use_context: true
  num_rows_context: 3
- name: GPT-5 | Examples
  implementation: llm
  provider: openrouter
  model: openai/gpt-5
  prompt_key: with_examples
  batch_size: 10
  use_context: false
- name: GPT-5 | Examples + Table Context
  implementation: llm
  provider: openrouter
  model: openai/gpt-5
  prompt_key: with_examples_and_table
  batch_size: 10
  use_context: true
  num_rows_context: 3
