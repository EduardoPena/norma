experiment_name: "GT-Only Mapper Evaluation - HMDA Sample"
experiment_type: "mapper_gt_only"
results_dir: "results/mapper_gt_only_hmda"

datasets:
  - hmda

dataset_options:
  hmda:
    sample_rows: 10000
    gt_file: "hmda_text2rule_gt.json"
    drop_multi_rule_sentences: true

variants:
  - name: "MultiStep | OpenRouter | Gemini 2.5 Flash"
    use_context: false
    mapper:
      implementation: "multi_step_refinement"
      provider: "openrouter"
      model: "google/gemini-2.5-flash"
      max_refinement_iterations: 2
      prompt_file: "multi_step_refinement"