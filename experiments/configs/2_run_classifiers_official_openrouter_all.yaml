experiment_name: "Official Reproduction - Classifier - OpenRouter"
experiment_type: "classifier"
results_dir: "results/official_openrouter/classifier"

# The four paper datasets come first; HMDA variants are reported separately.
datasets:
  - hospital
  - restaurant
  - sisu
  - tax
  - hmda_checks
  - hmdaz

dataset_options:
  hospital:
    data_file: "hospital-holo.csv"
    gt_file: "hospital-holo_text2rule_gt.json"
    stream_csv: true
    profile_rows: 10000
  restaurant:
    data_file: "restaurant-inspections.csv"
    gt_file: "restaurant-inspections_text2rule_gt.json"
    stream_csv: true
    profile_rows: 10000
  tax:
    data_file: "tax_normalized.csv"
    gt_file: "tax_text2rule_gt.json"
    stream_csv: true
    profile_rows: 10000
  hmda_checks:
    data_file: "hmda.csv"
    gt_file: "hmda_regc_checks-text2rule-gt.json"
    stream_csv: true
    profile_rows: 10000
    validate_ground_truth: false
    validate_predicates: false
  hmdaz:
    data_file: "hmdaz.csv"
    gt_file: "hmdaz_text2rule_gt.json"
    stream_csv: true
    profile_rows: 10000
    validate_ground_truth: false
    validate_predicates: false

variants:
  - { name: "GPT-5 | No Context", implementation: "llm", provider: "openrouter", model: "openai/gpt-5", prompt_key: "zero_shot", batch_size: 10, use_context: false }
  - { name: "GPT-5 | Table Context", implementation: "llm", provider: "openrouter", model: "openai/gpt-5", prompt_key: "zero_shot_with_table", batch_size: 10, use_context: true, num_rows_context: 3 }
  - { name: "GPT-5 | Examples", implementation: "llm", provider: "openrouter", model: "openai/gpt-5", prompt_key: "with_examples", batch_size: 10, use_context: false }
  - { name: "GPT-5 | Examples + Table Context", implementation: "llm", provider: "openrouter", model: "openai/gpt-5", prompt_key: "with_examples_and_table", batch_size: 10, use_context: true, num_rows_context: 3 }
  - { name: "GPT-5 Mini | No Context", implementation: "llm", provider: "openrouter", model: "openai/gpt-5-mini", prompt_key: "zero_shot", batch_size: 10, use_context: false }
  - { name: "GPT-5 Mini | Table Context", implementation: "llm", provider: "openrouter", model: "openai/gpt-5-mini", prompt_key: "zero_shot_with_table", batch_size: 10, use_context: true, num_rows_context: 3 }
  - { name: "GPT-5 Mini | Examples", implementation: "llm", provider: "openrouter", model: "openai/gpt-5-mini", prompt_key: "with_examples", batch_size: 10, use_context: false }
  - { name: "GPT-5 Mini | Examples + Table Context", implementation: "llm", provider: "openrouter", model: "openai/gpt-5-mini", prompt_key: "with_examples_and_table", batch_size: 10, use_context: true, num_rows_context: 3 }
  - { name: "Llama 3.3 70B | No Context", implementation: "llm", provider: "openrouter", model: "meta-llama/llama-3.3-70b-instruct", prompt_key: "zero_shot", batch_size: 10, use_context: false }
  - { name: "Llama 3.3 70B | Table Context", implementation: "llm", provider: "openrouter", model: "meta-llama/llama-3.3-70b-instruct", prompt_key: "zero_shot_with_table", batch_size: 10, use_context: true, num_rows_context: 3 }
  - { name: "Llama 3.3 70B | Examples", implementation: "llm", provider: "openrouter", model: "meta-llama/llama-3.3-70b-instruct", prompt_key: "with_examples", batch_size: 10, use_context: false }
  - { name: "Llama 3.3 70B | Examples + Table Context", implementation: "llm", provider: "openrouter", model: "meta-llama/llama-3.3-70b-instruct", prompt_key: "with_examples_and_table", batch_size: 10, use_context: true, num_rows_context: 3 }
  - { name: "Mistral Large | No Context", implementation: "llm", provider: "openrouter", model: "mistralai/mistral-large-2512", prompt_key: "zero_shot", batch_size: 10, use_context: false }
  - { name: "Mistral Large | Table Context", implementation: "llm", provider: "openrouter", model: "mistralai/mistral-large-2512", prompt_key: "zero_shot_with_table", batch_size: 10, use_context: true, num_rows_context: 3 }
  - { name: "Mistral Large | Examples", implementation: "llm", provider: "openrouter", model: "mistralai/mistral-large-2512", prompt_key: "with_examples", batch_size: 10, use_context: false }
  - { name: "Mistral Large | Examples + Table Context", implementation: "llm", provider: "openrouter", model: "mistralai/mistral-large-2512", prompt_key: "with_examples_and_table", batch_size: 10, use_context: true, num_rows_context: 3 }
  - { name: "Mistral Small | No Context", implementation: "llm", provider: "openrouter", model: "mistralai/mistral-small-3.2-24b-instruct", prompt_key: "zero_shot", batch_size: 10, use_context: false }
