experiment_name: "Classifier - HMDAZ - OpenRouter GPT-5.4 - With Context"
experiment_type: "classifier"
results_dir: "results/hmdaz_gpt54/classifier"

datasets:
  - hmdaz

dataset_options:
  hmdaz:
    data_file: "hmdaz.csv"
    gt_file: "hmdaz_text2rule_gt.json"
    stream_csv: true
    profile_rows: 10000
    validate_ground_truth: false
    validate_predicates: false

variants:
  - name: "OpenRouter | GPT-5.4 | with_examples_and_table"
    implementation: "llm"
    provider: "openrouter"
    model: "openai/gpt-5.4"
    prompt_key: "with_examples_and_table"
    batch_size: 20
    use_context: true
    num_rows_context: 3