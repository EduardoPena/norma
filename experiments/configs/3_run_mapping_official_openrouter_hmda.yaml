experiment_name: "Official Reproduction - GT-Only Mapping - HMDA"
experiment_type: "mapper_gt_only"
results_dir: "results/official_openrouter/mapping_hmda_rerun"
max_gt_rules: 3

datasets:
  - hmda_checks
  - hmdaz

dataset_options:
  hmda_checks: { data_file: "hmda.csv", gt_file: "hmda_regc_checks-text2rule-gt.json", stream_csv: true, profile_rows: 10000, validate_ground_truth: false, validate_predicates: false }
  hmdaz: { data_file: "hmdaz.csv", gt_file: "hmdaz_text2rule_gt.json", stream_csv: true, profile_rows: 10000, validate_ground_truth: false, validate_predicates: false }

variants:
  - name: "Single Prompt | GPT-5"
    use_context: false
    mapper: { implementation: "llm", provider: "openrouter", model: "openai/gpt-5", prompt_key: "with_examples", batch_size: 10, structured_output: true }
  - name: "Multi-Step | GPT-5"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "openai/gpt-5", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true }
  - name: "Single Prompt | GPT-5 Mini"
    use_context: false
    mapper: { implementation: "llm", provider: "openrouter", model: "openai/gpt-5-mini", prompt_key: "with_examples", batch_size: 10, structured_output: true }
  - name: "Multi-Step | GPT-5 Mini"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "openai/gpt-5-mini", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true }
  - name: "Single Prompt | Llama 3.3 70B"
    use_context: false
    mapper: { implementation: "llm", provider: "openrouter", model: "meta-llama/llama-3.3-70b-instruct", prompt_key: "with_examples", batch_size: 10, structured_output: true }
  - name: "Multi-Step | Llama 3.3 70B"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "meta-llama/llama-3.3-70b-instruct", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true }
  - name: "Single Prompt | Mistral Large"
    use_context: false
    mapper: { implementation: "llm", provider: "openrouter", model: "mistralai/mistral-large", prompt_key: "with_examples", batch_size: 10, structured_output: true }
  - name: "Multi-Step | Mistral Large"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "mistralai/mistral-large", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true }
  - name: "Single Prompt | Mistral Small"
    use_context: false
    mapper: { implementation: "llm", provider: "openrouter", model: "mistralai/mistral-small-3.2-24b-instruct", prompt_key: "with_examples", batch_size: 10, structured_output: true }
  - name: "Multi-Step | Mistral Small"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "mistralai/mistral-small-3.2-24b-instruct", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true }
  - name: "Single Prompt | Qwen3 32B"
    use_context: false
    mapper: { implementation: "llm", provider: "openrouter", model: "qwen/qwen3-32b", prompt_key: "with_examples", batch_size: 10, structured_output: true }
  - name: "Multi-Step | Qwen3 32B"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "qwen/qwen3-32b", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true }