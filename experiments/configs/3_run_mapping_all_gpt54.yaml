experiment_name: "GT-Only Mapper - All Datasets - OpenRouter GPT-5.4"
experiment_type: "mapper_gt_only"
results_dir: "results/all_datasets_gpt54/mapping"

datasets:
  - restaurant
  - sisu
  - sisu-en
  - hospital
  - tax
  - hmda_checks
  - hmdaz

dataset_options:
  restaurant:
    data_file: "restaurant-inspections.csv"
    gt_file: "restaurant-inspections_text2rule_gt.json"
    stream_csv: true
    profile_rows: 10000
    validate_ground_truth: false
    validate_predicates: false
  sisu:
    data_file: "sisu.csv"
    gt_file: "sisu_text2rule_gt.json"
    stream_csv: true
    profile_rows: 10000
    validate_ground_truth: false
    validate_predicates: false
  sisu-en:
    data_file: "sisu-en.csv"
    gt_file: "sisu-en_text2rule_gt.json"
    stream_csv: true
    profile_rows: 10000
    validate_ground_truth: false
    validate_predicates: false
  hospital:
    data_file: "hospital-holo.csv"
    gt_file: "hospital-holo_text2rule_gt.json"
    stream_csv: true
    profile_rows: 10000
    validate_ground_truth: false
    validate_predicates: false
  tax:
    data_file: "tax_normalized.csv"
    gt_file: "tax_text2rule_gt.json"
    stream_csv: true
    profile_rows: 10000
    validate_ground_truth: false
    validate_predicates: false
  hmda_checks:
    data_file: "hmda.csv"
    gt_file: "hmda_regc_checks-text2rule-gt.json"
    stream_csv: true
    profile_rows: 10000
    validate_ground_truth: false
    validate_predicates: false
  hmdaz:
    data_file: "hmdaz.csv"
    gt_file: "hmdaz_text2rule_gt.json"
    stream_csv: true
    profile_rows: 10000
    validate_ground_truth: false
    validate_predicates: false

variants:
  - name: "MultiStep | OpenRouter | GPT-5.4"
    use_context: false
    mapper:
      implementation: "multi_step_refinement"
      provider: "openrouter"
      model: "openai/gpt-5.4"
      max_refinement_iterations: 2
      prompt_file: "multi_step_refinement"