experiment_name: "Sentence-Level Mappers (Direct & Filtered)"
experiment_type: "mapper"
results_dir: "results"

datasets:
  - tax

variants:
  # SENTENCE_DIRECT: Map all sentences directly (no classifier)
  - name: "GPT-5 DIRECT (with_examples_and_table)"
    mode: "SENTENCE_DIRECT"
    mapper:
      implementation: "llm"
      model: "gpt-5"
      prompt_key: "with_examples_and_table"
      batch_size: 10
    use_context: true
    num_rows_context: 3
  
  # SENTENCE_FILTERED: Classify first, then map only rules
  - name: "Mistral+GPT-5 FILTERED (with_examples + with_examples_and_table)"
    mode: "SENTENCE_FILTERED"
    classifier:
      implementation: "llm"
      model: "mistral-small-2506"
      prompt_key: "with_examples"
    mapper:
      implementation: "llm"
      model: "gpt-5"
      prompt_key: "with_examples_and_table"
      batch_size: 10
    use_context: true
    num_rows_context: 3