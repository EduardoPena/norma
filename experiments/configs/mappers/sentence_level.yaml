  - name: "Mistral+GPT-5 FILTERED and multistep (with_examples + multi_step_refinement)"
    mode: "SENTENCE_FILTERED"
    classifier:
      implementation: "llm"
      model: "mistral-small-2506"
      prompt_key: "with_examples"
    mapper:
      implementation: "multi_step_refinement"
      model: "gpt-5-mini"
      max_refinement_iterations: 2
      prompt_file: "multi_step_refinement_less_restrict"

    use_context: false