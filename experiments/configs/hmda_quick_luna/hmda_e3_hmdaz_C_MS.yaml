experiment_name: hmda_e3_hmdaz_C_MS
experiment_type: mapper
results_dir: results/hmda_quick_luna/e3_end2end
datasets:
- hmdaz
dataset_options:
  hmdaz:
    gt_file: hmdaz_text2rule_gt.json
    sample_rows: 100000
    stream_csv: true
    drop_multi_rule_sentences: false
variants:
- name: C+MS | GPT-6 Luna + GPT-6 Luna
  mode: SENTENCE_FILTERED
  use_context: true
  num_rows_context: 3
  classifier:
    implementation: llm
    provider: openrouter
    model: openai/gpt-6-luna
    prompt_key: zero_shot_with_table
    batch_size: 10
  mapper:
    implementation: multi_step_refinement
    provider: openrouter
    max_refinement_iterations: 2
    prompt_file: multi_step_refinement
    model: openai/gpt-6-luna
