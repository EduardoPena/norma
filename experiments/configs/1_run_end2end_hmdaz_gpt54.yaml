experiment_name: "End-to-End - HMDAZ 100k + Tax - OpenRouter GPT-5.4"
experiment_type: "mapper"
results_dir: "results/hmdaz_tax_gpt54/end2end"

datasets:
  - hmdaz
  - tax

dataset_options:
  hmdaz:
    data_file: "hmdaz.csv"
    gt_file: "hmdaz_text2rule_gt.json"
    sample_rows: 100000
    stream_csv: true
    profile_rows: 10000
    validate_ground_truth: false
  tax:
    data_file: "tax_normalized.csv"
    gt_file: "tax_text2rule_gt.json"
    stream_csv: true
    profile_rows: 10000
    validate_ground_truth: false

variants:
  - name: "FILTERED | OpenRouter | GPT-5.4"
    mode: "SENTENCE_FILTERED"
    use_context: false
    classifier:
      implementation: "llm"
      provider: "openrouter"
      model: "openai/gpt-5.4"
      prompt_key: "with_examples"
    mapper:
      implementation: "multi_step_refinement"
      provider: "openrouter"
      model: "openai/gpt-5.4"
      max_refinement_iterations: 2
      prompt_file: "multi_step_refinement"