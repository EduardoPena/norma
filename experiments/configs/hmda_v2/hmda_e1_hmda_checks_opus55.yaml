experiment_name: hmda_e1_hmda_checks_opus55
experiment_type: classifier
results_dir: results/hmda_v2/e1_classifiers
datasets:
- hmda_checks
dataset_options:
  hmda_checks:
    gt_file: hmda_regc_checks-text2rule-gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
variants:
- name: Claude Opus 5.5 | No Context
  implementation: llm
  provider: openrouter
  model: anthropic/claude-opus-5.5
  prompt_key: zero_shot
  batch_size: 10
  use_context: false
- name: Claude Opus 5.5 | Table Context
  implementation: llm
  provider: openrouter
  model: anthropic/claude-opus-5.5
  prompt_key: zero_shot_with_table
  batch_size: 10
  use_context: true
  num_rows_context: 3
- name: Claude Opus 5.5 | Examples
  implementation: llm
  provider: openrouter
  model: anthropic/claude-opus-5.5
  prompt_key: with_examples
  batch_size: 10
  use_context: false
- name: Claude Opus 5.5 | Examples + Table Context
  implementation: llm
  provider: openrouter
  model: anthropic/claude-opus-5.5
  prompt_key: with_examples_and_table
  batch_size: 10
  use_context: true
  num_rows_context: 3
