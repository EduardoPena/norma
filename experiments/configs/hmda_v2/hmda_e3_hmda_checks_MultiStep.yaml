experiment_name: hmda_e3_hmda_checks_MultiStep
experiment_type: mapper
results_dir: results/hmda_v2/e3_end2end
datasets:
- hmda_checks
dataset_options:
  hmda_checks:
    gt_file: hmda_regc_checks-text2rule-gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
variants:
- name: Multi-Step | Claude Opus 5.5
  mode: SENTENCE_DIRECT
  use_context: false
  mapper:
    implementation: multi_step_refinement
    provider: openrouter
    max_refinement_iterations: 2
    prompt_file: multi_step_refinement
    model: anthropic/claude-opus-5.5
