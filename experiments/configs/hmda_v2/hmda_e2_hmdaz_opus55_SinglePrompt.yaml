experiment_name: hmda_e2_hmdaz_opus55_SinglePrompt
experiment_type: mapper_gt_only
results_dir: results/hmda_v2/e2_mapping
datasets:
- hmdaz
dataset_options:
  hmdaz:
    gt_file: hmdaz_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
variants:
- name: Single Prompt | Claude Opus 5.5
  use_context: false
  mapper:
    implementation: llm
    provider: openrouter
    model: anthropic/claude-opus-5.5
    prompt_key: with_examples
    batch_size: 10
    filter_predicates: true
    max_candidate_predicates: 1000
    max_relevant_columns: 12
