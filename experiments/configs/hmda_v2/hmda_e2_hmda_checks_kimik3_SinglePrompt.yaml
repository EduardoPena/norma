experiment_name: hmda_e2_hmda_checks_kimik3_SinglePrompt
experiment_type: mapper_gt_only
results_dir: results/hmda_v2/e2_mapping
datasets:
- hmda_checks
dataset_options:
  hmda_checks:
    gt_file: hmda_regc_checks-text2rule-gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
variants:
- name: Single Prompt | Kimi K3
  use_context: false
  mapper:
    implementation: llm
    provider: openrouter
    model: moonshotai/kimi-k3
    prompt_key: with_examples
    batch_size: 10
