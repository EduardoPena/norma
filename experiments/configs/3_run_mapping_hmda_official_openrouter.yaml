experiment_name: "GT-Only Mapper Evaluation - HMDA Official - OpenRouter Battery"
experiment_type: "mapper_gt_only"
results_dir: "results/official_hmda/mapping"

datasets:
  - hmda

dataset_options:
  hmda:
    gt_file: "hmda_text2rule_gt.json"
    drop_multi_rule_sentences: true
    stream_csv: true
    profile_rows: 10000

variants:
  - name: "MultiStep | OpenRouter | GPT-5"
    use_context: false
    mapper:
      implementation: "multi_step_refinement"
      provider: "openrouter"
      model: "openai/gpt-5"
      max_refinement_iterations: 2
      prompt_file: "multi_step_refinement"

  - name: "MultiStep | OpenRouter | GPT-5 Mini"
    use_context: false
    mapper:
      implementation: "multi_step_refinement"
      provider: "openrouter"
      model: "openai/gpt-5-mini"
      max_refinement_iterations: 2
      prompt_file: "multi_step_refinement"

  - name: "MultiStep | OpenRouter | Mistral Small"
    use_context: false
    mapper:
      implementation: "multi_step_refinement"
      provider: "openrouter"
      model: "mistralai/mistral-small-3.2-24b-instruct"
      max_refinement_iterations: 2
      prompt_file: "multi_step_refinement"

  - name: "MultiStep | OpenRouter | Mistral Large"
    use_context: false
    mapper:
      implementation: "multi_step_refinement"
      provider: "openrouter"
      model: "mistralai/mistral-large-2411"
      max_refinement_iterations: 2
      prompt_file: "multi_step_refinement"

  - name: "MultiStep | OpenRouter | Llama 3.3 70B"
    use_context: false
    mapper:
      implementation: "multi_step_refinement"
      provider: "openrouter"
      model: "meta-llama/llama-3.3-70b-instruct"
      max_refinement_iterations: 2
      prompt_file: "multi_step_refinement"

  - name: "MultiStep | OpenRouter | Qwen3 32B"
    use_context: false
    mapper:
      implementation: "multi_step_refinement"
      provider: "openrouter"
      model: "qwen/qwen3-32b"
      max_refinement_iterations: 2
      prompt_file: "multi_step_refinement"
