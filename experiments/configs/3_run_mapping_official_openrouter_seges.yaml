experiment_name: "Official Reproduction - GT-Only Mapping - SEGES"
experiment_type: "mapper_gt_only"
results_dir: "results/official_openrouter/mapping_seges"
max_gt_rules: 3

datasets:
  - seges

dataset_options:
  seges: { data_file: "seges.csv", gt_file: "seges_text2rule_gt.json", stream_csv: true, profile_rows: 10000, validate_ground_truth: false, validate_predicates: false }

variants:
  - name: "Single Prompt | GPT-5"
    use_context: false
    mapper: { implementation: "llm", provider: "openrouter", model: "openai/gpt-5", prompt_key: "with_examples", batch_size: 10, structured_output: true, use_sample_for_evaluation: true }
  - name: "Multi-Step | GPT-5"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "openai/gpt-5", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true, use_sample_for_evaluation: true, use_sample_for_validation: true }
  - name: "Single Prompt | GPT-5 Mini"
    use_context: false
    mapper: { implementation: "llm", provider: "openrouter", model: "openai/gpt-5-mini", prompt_key: "with_examples", batch_size: 10, structured_output: true, use_sample_for_evaluation: true }
  - name: "Multi-Step | GPT-5 Mini"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "openai/gpt-5-mini", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true, use_sample_for_evaluation: true, use_sample_for_validation: true }
  - name: "Single Prompt | Llama 3.3 70B"
    use_context: false
    mapper: { implementation: "llm", provider: "openrouter", model: "meta-llama/llama-3.3-70b-instruct", prompt_key: "with_examples", batch_size: 10, structured_output: true, use_sample_for_evaluation: true }
  - name: "Multi-Step | Llama 3.3 70B"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "meta-llama/llama-3.3-70b-instruct", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true, use_sample_for_evaluation: true, use_sample_for_validation: true }
  - name: "Single Prompt | Mistral Medium 3.5"
    use_context: false
    mapper: { implementation: "llm", provider: "openrouter", model: "mistralai/mistral-medium-3-5", prompt_key: "with_examples", batch_size: 10, structured_output: true, use_sample_for_evaluation: true }
  - name: "Multi-Step | Mistral Medium 3.5"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "mistralai/mistral-medium-3-5", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true, use_sample_for_evaluation: true, use_sample_for_validation: true, enable_semantic_auditor: false }
  - name: "Single Prompt | Mistral Small"
    use_context: false
    mapper: { implementation: "llm", provider: "openrouter", model: "mistralai/mistral-small-3.2-24b-instruct", prompt_key: "with_examples", batch_size: 10, structured_output: true, use_sample_for_evaluation: true }
  - name: "Multi-Step | Mistral Small"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "mistralai/mistral-small-3.2-24b-instruct", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true, use_sample_for_evaluation: true, use_sample_for_validation: true, enable_semantic_auditor: false }
  - name: "Single Prompt | Qwen3 32B"
    use_context: false
    mapper: { implementation: "llm", provider: "openrouter", model: "qwen/qwen3-32b", prompt_key: "with_examples", batch_size: 10, structured_output: true, use_sample_for_evaluation: true }
  - name: "Multi-Step | Qwen3 32B"
    use_context: false
    mapper: { implementation: "multi_step_refinement", provider: "openrouter", model: "qwen/qwen3-32b", max_refinement_iterations: 2, prompt_file: "multi_step_refinement", collect_timing: true, structured_output: true, use_sample_for_evaluation: true, use_sample_for_validation: true }