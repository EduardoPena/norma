experiment_name: "HMDA Checks Mistral Small Examples Retry"
experiment_type: "classifier"
results_dir: "results/official_openrouter/classifier_hmda_checks_mistral_small_examples_retry"
max_gt_rules: 3

datasets:
  - hmda_checks

dataset_options:
  hmda_checks: { data_file: "hmda.csv", gt_file: "hmda_regc_checks-text2rule-gt.json", stream_csv: true, profile_rows: 10000, validate_ground_truth: false, validate_predicates: false }

variants:
  - { name: "Mistral Small | Examples", implementation: "llm", provider: "openrouter", model: "mistralai/mistral-small-3.2-24b-instruct", prompt_key: "with_examples", batch_size: 10, use_context: false }