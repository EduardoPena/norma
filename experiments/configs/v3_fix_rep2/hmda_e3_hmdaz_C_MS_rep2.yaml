experiment_name: hmda_e3_hmdaz_C_MS_rep2
experiment_type: mapper
results_dir: results/v3_fix_rep2/e3_end2end
datasets:
- hmdaz
dataset_options:
  hmdaz:
    gt_file: hmdaz_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
    predicate_space: v2
variants:
- name: C+MS | Qwen3.8-2.4T-A95B + Claude Sonnet 5.5
  mode: SENTENCE_FILTERED
  use_context: false
  classifier:
    implementation: llm
    provider: openrouter
    model: qwen/qwen3.8-2.4t-a95b
    prompt_key: with_examples
    batch_size: 10
  mapper:
    implementation: multi_step_refinement
    provider: openrouter
    max_refinement_iterations: 2
    prompt_file: multi_step_refinement
    max_violation_share: 0.9
    model: anthropic/claude-sonnet-5.5
