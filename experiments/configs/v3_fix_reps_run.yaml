# Repetitions 2 and 3 of E3 (version_fix) and, originally, the re-run of the Multi-Step jobs of round v3 after the G2 gate became relative
# (max_violation_share = 0.9 of the tuples; it was an absolute 55,000 / 10,000
# limit) — E2 Multi-Step (6 models x 6 datasets) and E3 (C+MS, Multi-Step).
# E1 and Single-Prompt are unchanged and come from results/v3_reeval.
# Runner configs: experiments/configs/v3_fix/plan_multistep_e2_e3.json.
results_dir: "results/v3_fix_reps/telemetry"
sample_rows: 1000000
max_tokens: 32768
request_timeout_s: 600
max_cost_usd: 85.0        # two E3 repetitions with Claude Sonnet 5.5 (estimate ~US$ 70)
parallel_requests: 6
parallel_jobs: 2
min_free_memory_gib: 6
