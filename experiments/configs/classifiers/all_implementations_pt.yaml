experiment_name: "Classifier Comparison - All Implementations"
experiment_type: "classifier"
results_dir: "results"
datasets:
  - sisu

variants:

 # ============================================
  # Sabiá-4
  # ============================================
  - name: "Sabia-4 (zero_shot_pt)"
    implementation: "llm"
    model: "sabia-4"
    prompt_key: "zero_shot_pt"
    batch_size: 10
    use_context: false

  - name: "Sabia-4 (zero_shot_with_table_pt)"
    implementation: "llm"
    model: "sabia-4"
    prompt_key: "zero_shot_with_table_pt"
    batch_size: 10
    use_context: true
    num_rows_context: 3

  - name: "Sabia-4 (with_examples_pt)"
    implementation: "llm"
    model: "sabia-4"
    prompt_key: "with_examples_pt"
    batch_size: 10
    use_context: false

  - name: "Sabia-4 (with_examples_and_table_pt)"
    implementation: "llm"
    model: "sabia-4"
    prompt_key: "with_examples_and_table_pt"
    batch_size: 10
    use_context: true
    num_rows_context: 3


