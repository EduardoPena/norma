experiment_name: "Classifier Comparison - All Implementations"
experiment_type: "classifier"
results_dir: "results"  # Can change to "experiments", "runs", etc.

datasets:
  - person


variants:
  # LLM implementations
  - name: "GPT-5-mini (zero_shot)"
    implementation: "llm"
    model: "gpt-5-mini"
    prompt_key: "zero_shot"
    batch_size: 10
    use_context: false
  
  - name: "Mistral-large (zero_shot with table)"
    implementation: "llm"
    model: "mistral-large-2512"
    prompt_key: "zero_shot_with_table"
    batch_size: 10
    use_context: true
    num_rows_context: 3
  
