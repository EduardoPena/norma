experiment_name: hmda_e2_hmda_checks_qwen32b_MultiStep
experiment_type: mapper_gt_only
results_dir: results/hmda/full
datasets:
- hmda_checks
dataset_options:
  hmda_checks:
    gt_file: hmda_regc_checks-text2rule-gt.json
    sample_rows: 1000000
    drop_multi_rule_sentences: false
variants:
- name: MultiStep
  use_context: false
  num_rows_context: 3
  mapper:
    implementation: multi_step_refinement
    provider: openrouter
    model: qwen/qwen3-32b
    max_tokens: 8192
    max_refinement_iterations: 2
    prompt_file: multi_step_refinement
    enforce_rule_gate: true
    include_column_descriptions: false
