experiment_name: hmda_e1_hmda_checks_mistrallarge
experiment_type: classifier
results_dir: results/hmda/full
datasets:
- hmda_checks
dataset_options:
  hmda_checks:
    gt_file: hmda_regc_checks-text2rule-gt.json
    sample_rows: 1000000
    drop_multi_rule_sentences: false
variants:
- name: zero_shot
  implementation: llm
  provider: openrouter
  model: mistralai/mistral-large
  prompt_key: zero_shot
  batch_size: 20
  use_context: false
  num_rows_context: 3
- name: zero_shot_with_table
  implementation: llm
  provider: openrouter
  model: mistralai/mistral-large
  prompt_key: zero_shot_with_table
  batch_size: 20
  use_context: true
  num_rows_context: 3
- name: with_examples
  implementation: llm
  provider: openrouter
  model: mistralai/mistral-large
  prompt_key: with_examples
  batch_size: 20
  use_context: false
  num_rows_context: 3
- name: with_examples_and_table
  implementation: llm
  provider: openrouter
  model: mistralai/mistral-large
  prompt_key: with_examples_and_table
  batch_size: 20
  use_context: true
  num_rows_context: 3
