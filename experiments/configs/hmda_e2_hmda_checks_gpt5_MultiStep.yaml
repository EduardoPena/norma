experiment_name: hmda_e2_hmda_checks_gpt5_MultiStep
experiment_type: mapper_gt_only
results_dir: results/hmda/e2_mapping
datasets:
- hmda_checks
dataset_options:
  hmda_checks:
    gt_file: hmda_regc_checks-text2rule-gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
variants:
- name: Multi-Step | GPT-5
  use_context: false
  mapper:
    implementation: multi_step_refinement
    provider: openrouter
    max_refinement_iterations: 2
    prompt_file: multi_step_refinement
    model: openai/gpt-5
