experiment_name: hmda_e2_hmda_checks_sonnet55_MultiStep
experiment_type: mapper_gt_only
results_dir: results/v3_fix/e2_mapping
datasets:
- hmda_checks
dataset_options:
  hmda_checks:
    gt_file: hmda_regc_checks-text2rule-gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
    predicate_space: v2
variants:
- name: Multi-Step | Claude Sonnet 5.5
  use_context: false
  mapper:
    implementation: multi_step_refinement
    provider: openrouter
    max_refinement_iterations: 2
    prompt_file: multi_step_refinement
    max_violation_share: 0.9
    model: anthropic/claude-sonnet-5.5
