experiment_name: hmda_e2_hospital_mistrallarge4_SinglePrompt
experiment_type: mapper_gt_only
results_dir: results/v3_fix/e2_mapping
datasets:
- hospital
dataset_options:
  hospital:
    gt_file: hospital-holo_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
    predicate_space: v2
variants:
- name: Single Prompt | Mistral Large 4
  use_context: false
  mapper:
    implementation: llm
    provider: openrouter
    model: mistralai/mistral-large-4-0
    prompt_key: with_examples_v2
    batch_size: 3
    explain_violation: true
    column_retrieval: semantic
    embedding_model: openai/text-embedding-3-large
    max_candidate_predicates: 1000
    max_relevant_columns: 12
