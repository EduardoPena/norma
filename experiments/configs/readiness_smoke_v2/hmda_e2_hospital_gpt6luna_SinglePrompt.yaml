experiment_name: hmda_e2_hospital_gpt6luna_SinglePrompt
experiment_type: mapper_gt_only
results_dir: results/readiness_smoke_v2/e2_mapping
datasets:
- hospital
dataset_options:
  hospital:
    gt_file: hospital-holo_text2rule_gt.json
    sample_rows: 100000
    stream_csv: true
    drop_multi_rule_sentences: false
    predicate_space: v2
variants:
- name: Single Prompt | GPT-6 Luna
  use_context: false
  mapper:
    implementation: llm
    provider: openrouter
    model: openai/gpt-6-luna
    prompt_key: with_examples
    batch_size: 10
