# Telemetry/budget config for the official round v3 (new paper version,
# 2026-10-13): 6 datasets (hospital, restaurant, sisu, tax, hmdaz, hmda_checks),
# 6 models (experiments/configs/v3_models.yaml), predicate space v2, improved
# Single-Prompt (with_examples_v2, semantic column retrieval), one run per config.
# Runner configs: experiments/configs/v3/hmda_plan_e1_e2.json, then the E3 plan
# once its components are chosen from E1/E2. Document-level is not run.
results_dir: "results/v3/telemetry"
sample_rows: 1000000      # HMDA: first 1,000,000 rows; paper datasets are read whole
max_tokens: 32768
request_timeout_s: 600
max_cost_usd: 150.0       # safety cap for E1+E2+E3 (estimate ~US$ 80-110)
parallel_requests: 6
parallel_jobs: 2          # never two jobs sharing a model
min_free_memory_gib: 6
# Kimi K2.6 loops on whitespace under strict json_schema decoding (health check
# 2026-10-13: 6/6 failures on Inceptron/CoreWeave/Parasail, 1/6 OK on Crusoe);
# JSON mode with the schema in the prompt passed 12/12 and the full health check.
# Kimi K2.6 was then replaced by MiniMax-M3 at the authors' request (2026-10-13),
# before any Kimi job ran; the entry below is kept (inactive) so that the resumed
# telemetry config stays identical.
json_object_models:
  - moonshotai/kimi-k2.6
