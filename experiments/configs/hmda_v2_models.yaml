# Official HMDA round (new paper version): models chosen by the authors on
# 2026-10-06. Order = execution order (cheapest first). Prices: OpenRouter,
# USD per million tokens (input / output) at selection time.
models:
  - key: gpt6luna
    paper_name: GPT-6 Luna
    slug: openai/gpt-6-luna
    note: Exact match (0.10 / 0.50). No temperature parameter (reasoning model).
  - key: deepseekv4flash
    paper_name: DeepSeek-V4-Flash
    slug: deepseek/deepseek-v4-flash
    note: >-
      "DeepSeek v4" chosen by the authors as the Flash line (0.00 / 1.28);
      v4-pro and dated snapshots also exist.
  - key: gpt6sol
    paper_name: GPT-6 Sol
    slug: openai/gpt-6-sol
    note: >-
      Exact match (2.00 / 10.00). gpt-6.1-sol (2026-09-29, same price) exists;
      the authors kept gpt-6-sol. No temperature parameter.
  - key: kimik3
    paper_name: Kimi K3
    slug: moonshotai/kimi-k3
    note: Exact match (0.83 / 14.00).
  - key: qwen38maxprime
    paper_name: Qwen3.8-Max-Prime
    slug: qwen/qwen3.8-max-prime
    note: >-
      "Qwen 3.8" chosen by the authors as the Max-Prime variant (4.00 / 12.00);
      27B, Flash and 2.4T-A95B variants also exist.
  - key: opus55
    paper_name: Claude Opus 5.5
    slug: anthropic/claude-opus-5.5
    note: Exact match (4.00 / 20.00).
# E3 components, chosen from E1/E2 with the paper criteria and confirmed by the
# authors on 2026-10-07: classifier = only config with recall >= 0.90 on both
# datasets (mean F1 0.90); mapper = best Multi-Step on constraint extraction and
# aggregate violation F1.
end2end:
  classifier: gpt6luna
  classifier_prompt: zero_shot_with_table   # "Table Context"
  mapper: opus55
