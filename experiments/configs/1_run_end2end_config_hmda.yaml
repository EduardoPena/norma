experiment_name: "Full Mapper Evaluation - HMDA Sample"
experiment_type: "mapper"
results_dir: "results/end2end_hmda"

datasets:
  - hmda

dataset_options:
  hmda:
    sample_rows: 10000
    gt_file: "hmda_text2rule_gt.json"
    drop_multi_rule_sentences: true

variants:
  - name: "FILTERED | openrouter-clf | openrouter-multi_step"
    mode: "SENTENCE_FILTERED"
    use_context: false
    classifier:
      implementation: "llm"
      provider: "openrouter"
      model: "google/gemini-2.5-flash"
      prompt_key: "with_examples"
    mapper:
      implementation: "multi_step_refinement"
      provider: "openrouter"
      model: "google/gemini-2.5-flash"
      max_refinement_iterations: 2
      prompt_file: "multi_step_refinement"

  - name: "DOCUMENT | openrouter | gemini-2.5-flash"
    mode: "DOCUMENT"
    use_context: true
    num_rows_context: 3
    document_mapper:
      implementation: "llm_document"
      provider: "openrouter"
      model: "google/gemini-2.5-flash"
      prompt_key: "basic_with_examples"