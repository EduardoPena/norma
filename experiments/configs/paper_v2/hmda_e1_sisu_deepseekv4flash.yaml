experiment_name: hmda_e1_sisu_deepseekv4flash
experiment_type: classifier
results_dir: results/paper_v2/e1_classifiers
datasets:
- sisu
dataset_options:
  sisu:
    gt_file: sisu_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
variants:
- name: DeepSeek-V4-Flash | No Context
  implementation: llm
  provider: openrouter
  model: deepseek/deepseek-v4-flash
  prompt_key: zero_shot
  batch_size: 10
  use_context: false
- name: DeepSeek-V4-Flash | Table Context
  implementation: llm
  provider: openrouter
  model: deepseek/deepseek-v4-flash
  prompt_key: zero_shot_with_table
  batch_size: 10
  use_context: true
  num_rows_context: 3
- name: DeepSeek-V4-Flash | Examples
  implementation: llm
  provider: openrouter
  model: deepseek/deepseek-v4-flash
  prompt_key: with_examples
  batch_size: 10
  use_context: false
- name: DeepSeek-V4-Flash | Examples + Table Context
  implementation: llm
  provider: openrouter
  model: deepseek/deepseek-v4-flash
  prompt_key: with_examples_and_table
  batch_size: 10
  use_context: true
  num_rows_context: 3
