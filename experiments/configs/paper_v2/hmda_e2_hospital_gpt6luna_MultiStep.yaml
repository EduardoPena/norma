experiment_name: hmda_e2_hospital_gpt6luna_MultiStep
experiment_type: mapper_gt_only
results_dir: results/paper_v2/e2_mapping
datasets:
- hospital
dataset_options:
  hospital:
    gt_file: hospital-holo_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
variants:
- name: Multi-Step | GPT-6 Luna
  use_context: false
  mapper:
    implementation: multi_step_refinement
    provider: openrouter
    max_refinement_iterations: 2
    prompt_file: multi_step_refinement
    model: openai/gpt-6-luna
