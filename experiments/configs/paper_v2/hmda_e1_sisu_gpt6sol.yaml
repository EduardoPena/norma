experiment_name: hmda_e1_sisu_gpt6sol
experiment_type: classifier
results_dir: results/paper_v2/e1_classifiers
datasets:
- sisu
dataset_options:
  sisu:
    gt_file: sisu_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
variants:
- name: GPT-6 Sol | No Context
  implementation: llm
  provider: openrouter
  model: openai/gpt-6-sol
  prompt_key: zero_shot
  batch_size: 10
  use_context: false
- name: GPT-6 Sol | Table Context
  implementation: llm
  provider: openrouter
  model: openai/gpt-6-sol
  prompt_key: zero_shot_with_table
  batch_size: 10
  use_context: true
  num_rows_context: 3
- name: GPT-6 Sol | Examples
  implementation: llm
  provider: openrouter
  model: openai/gpt-6-sol
  prompt_key: with_examples
  batch_size: 10
  use_context: false
- name: GPT-6 Sol | Examples + Table Context
  implementation: llm
  provider: openrouter
  model: openai/gpt-6-sol
  prompt_key: with_examples_and_table
  batch_size: 10
  use_context: true
  num_rows_context: 3
