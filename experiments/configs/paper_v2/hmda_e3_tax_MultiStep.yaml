experiment_name: hmda_e3_tax_MultiStep
experiment_type: mapper
results_dir: results/paper_v2/e3_end2end
datasets:
- tax
dataset_options:
  tax:
    gt_file: tax_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
variants:
- name: Multi-Step | Claude Opus 5.5
  mode: SENTENCE_DIRECT
  use_context: false
  mapper:
    implementation: multi_step_refinement
    provider: openrouter
    max_refinement_iterations: 2
    prompt_file: multi_step_refinement
    model: anthropic/claude-opus-5.5
