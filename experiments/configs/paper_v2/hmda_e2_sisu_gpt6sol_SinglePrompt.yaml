experiment_name: hmda_e2_sisu_gpt6sol_SinglePrompt
experiment_type: mapper_gt_only
results_dir: results/paper_v2/e2_mapping
datasets:
- sisu
dataset_options:
  sisu:
    gt_file: sisu_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
variants:
- name: Single Prompt | GPT-6 Sol
  use_context: false
  mapper:
    implementation: llm
    provider: openrouter
    model: openai/gpt-6-sol
    prompt_key: with_examples
    batch_size: 10
