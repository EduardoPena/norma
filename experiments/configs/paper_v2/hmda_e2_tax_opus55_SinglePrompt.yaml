experiment_name: hmda_e2_tax_opus55_SinglePrompt
experiment_type: mapper_gt_only
results_dir: results/paper_v2/e2_mapping
datasets:
- tax
dataset_options:
  tax:
    gt_file: tax_text2rule_gt.json
    sample_rows: 1000000
    stream_csv: true
    drop_multi_rule_sentences: false
variants:
- name: Single Prompt | Claude Opus 5.5
  use_context: false
  mapper:
    implementation: llm
    provider: openrouter
    model: anthropic/claude-opus-5.5
    prompt_key: with_examples
    batch_size: 10
