datasets:
- restaurant
experiment_name: Sentence-Level Mappers on GT Only - Direct Mode All Models
experiment_type: mapper
results_dir: results
variants:
- mapper:
    batch_size: 10
    implementation: llm
    model: gpt-5-mini
    num_rows_context: 3
    prompt_key: with_examples_and_table
    use_context: true
  mode: SENTENCE_DIRECT
  name: GPT-5-mini DIRECT (with_examples_and_table)
- mapper:
    implementation: multi_step_refinement
    max_refinement_iterations: 2
    model: gpt-5-mini
    prompt_file: multi_step_refinement_less_restrict
  mode: SENTENCE_DIRECT
  name: GPT-5-mini MultiStepRefinement (Less Restrictive)
  use_context: false
