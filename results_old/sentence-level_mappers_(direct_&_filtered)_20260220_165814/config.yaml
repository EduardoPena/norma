datasets:
- sisu
experiment_name: Sentence-Level Mappers (Direct & Filtered)
experiment_type: mapper
results_dir: results
variants:
- classifier:
    implementation: llm
    model: mistral-small-2506
    prompt_key: with_examples
  mapper:
    batch_size: 10
    implementation: llm
    model: gpt-5
    prompt_key: with_examples_and_table
  mode: SENTENCE_FILTERED
  name: Mistral+GPT-5 FILTERED (with_examples + with_examples_and_table)
  num_rows_context: 3
  use_context: true
- classifier:
    implementation: llm
    model: mistral-small-2506
    prompt_key: with_examples
  mapper:
    implementation: multi_step_refinement
    max_refinement_iterations: 2
    model: gpt-5-mini
    prompt_file: multi_step_refinement_less_restrict
  mode: SENTENCE_FILTERED
  name: Mistral+GPT-5 FILTERED and multistep (with_examples + multi_step_refinement)
  use_context: false
