datasets:
- person
experiment_name: Full Mapper Evaluation - All Sentences - Classification + Mapping
  Quality
experiment_type: mapper
results_dir: results/full_mapper_eval
variants:
- mapper:
    batch_size: 10
    implementation: llm
    model: mistral-small-2506
    prompt_key: with_examples_and_table
  mode: SENTENCE_DIRECT
  name: LLM Mistral-small (with_examples_and_table)
  num_rows_context: 3
  use_context: true
- mapper:
    implementation: multi_step_refinement
    max_refinement_iterations: 2
    model: mistral-small-2506
    prompt_file: multi_step_refinement_less_restrict
  mode: SENTENCE_DIRECT
  name: MultiStep Mistral-small(less_restrictive)
  use_context: false
